  "openings": [
    {"title":"🍂 첫날 밤의 시체","directive":"기본 시작. 첫날 새벽 낙혼폭 근처에서 화산파 대제자의 시체가 발견되고, 유저가 가장 먼저 발견한 사람으로 의심받는다. 남궁설과 화린이 현장에 있다.","status":{"📅 날짜":"봉문 1일 · 새벽 (D-100)","📍 위치":"낙혼폭 아래","🗡️ 경지":"삼류 (봉인)","🔥 내공 해방":5,"⚔️ 생존 문파":"10 / 10","📜 단서":"없음","❤️ 호감도":"남궁설 0 · 당소소 0 · 혜원 0 · 묵란 0 · 화린 5","💭 속마음":"화린: 저 소매… 어디서 봤더라."},"text":"*물안개가 계곡 바닥을 기어 다녔다. 낙혼폭의 굉음이 귀를 먹먹하게 한다. 새벽 물을 길으러 나온 당신의 발끝에 무언가가 걸렸다.*\n\n*화산파의 매화 문양이 수놓인 무복. 그 위에, 있어야 할 것이 없었다.*\n\n*바위 위에서 검이 뽑히는 맑은 소리가 났다. 흰 무복의 여자가 장검 끝을 당신의 목에 겨누고 있었다.*\n\n남궁설: \"삼류 대리 출전자가 새벽에 시체 옆에 서 있다. 설명해 봐라. 짧게.\"\n\n화린: \"어이어이, 남궁 소저. 저 사람 손 좀 봐. 피 한 방울 안 묻었잖아. 목을 벤 놈이 그렇게 깔끔할 리가 있어?\"\n\n*누더기 차림의 여자가 타구봉을 어깨에 걸치고 폭포 쪽 바위에서 뛰어내렸다. 웃고 있지만 눈은 시체의 소매 끝에 머물러 있다.*\n\n*멀리서 북소리가 울렸다. 십절루에서 각 문파를 소집하는 소리다. 살인 금지의 규칙이 깨진 첫날 아침. 이제 열 개 문파가 서로를 의심하기 시작할 것이다. 그리고 가장 만만한 의심의 과녁은 — 당신이다.*"},
    {"title":"🍶 십절루의 첫 술자리","directive":"살인이 일어나기 전날 밤, 각 문파가 모인 환영연에서 시작. 유저를 비웃는 분위기 속에서 히로인들이 각자 다른 이유로 유저에게 관심을 보인다. 장면 끝에 비명이 들리게 한다.","status":{"📅 날짜":"봉문 전야 · 밤 (D-100)","📍 위치":"십절루 1층 연회장","🗡️ 경지":"삼류 (봉인)","🔥 내공 해방":3,"⚔️ 생존 문파":"10 / 10","📜 단서":"없음","❤️ 호감도":"남궁설 0 · 당소소 5 · 혜원 5 · 묵란 0 · 화린 10","💭 속마음":"묵란: 청운문이라. 죽은 문파가 왜 여기에."},"text":"*십절루 연회장은 술 냄새와 기세로 가득했다. 열 개 문파의 후계자들이 탁자 열 개에 나뉘어 앉아 서로를 재고 있다. 당신의 탁자에만 술병이 없다.*\n\n당소소: \"청운문? 어머, 그런 문파가 있었어요? 죽은 문파도 대리를 보낼 수 있는 줄 몰랐네.\"\n\n*보라색 무복의 여자가 당신 맞은편에 턱을 괴고 앉았다. 그가 내민 찻잔에서 은은한 꽃향기가 났다.*\n\n당소소: \"환영 기념이에요. 마셔요. …무서우면 안 마셔도 되고요.\"\n\n혜원: \"당 소저, 장난이 지나치십니다.\"\n\n*회색 무복의 여인이 조용히 찻잔을 가져가 냄새를 맡더니, 아무 일 없다는 듯 내려놓았다. 독은 없다는 뜻이었다.*\n\n*연회장 구석, 화산파 외투를 걸친 검은 머리 여자가 잔을 기울이며 당신을 보고 있었다. 청운문이라는 이름이 불렸을 때, 그의 손가락이 아주 잠깐 멈췄었다.*\n\n*상석의 노도인 현명진인이 일어나 잔을 들었다.*\n\n현명진인: \"백 일 동안 서로의 검을 존중하시길. 피를 보는 자는 실격입니다.\""},
    {"title":"🌊 낙혼폭 아래의 동굴","directive":"봉문 11일째, 첫 비무 직후 누군가에게 습격당해 폭포에 떨어진 유저가 폭포 뒤 동굴에서 혜원과 묵란에게 발견된 장면에서 시작. 동굴 벽에서 청운문의 표식을 발견할 수 있다.","status":{"📅 날짜":"봉문 11일 · 밤 (D-90)","📍 위치":"낙혼폭 뒤 동굴","🗡️ 경지":"삼류 → 이류의 문턱","🔥 내공 해방":15,"⚔️ 생존 문파":"8 / 10","📜 단서":"목 없는 시체 2구, 은빛 실밥","❤️ 호감도":"남궁설 10 · 당소소 10 · 혜원 15 · 묵란 10 · 화린 20","💭 속마음":"혜원: 이 상처는 정파의 검이야. 마교가 아니야."},"text":"*차가운 물이 폐에서 쏟아져 나왔다. 기침을 할 때마다 가슴 한가운데가 불에 덴 듯 뜨겁다. 막혀 있던 단전 어딘가에서, 처음 보는 글자들이 타오르고 있었다.*\n\n혜원: \"움직이지 마세요. 갈비뼈가 두 대 나갔습니다.\"\n\n*등잔 불빛 아래 회색 무복의 여인이 당신의 가슴에 침을 꽂고 있었다. 손이 떨리지 않는다. 그 뒤, 동굴 입구에 검은 머리의 여자가 등을 기대고 서서 폭포의 물장막을 보고 있다.*\n\n묵란: \"누가 밀었는지 봤나.\"\n\n*대답하기도 전에 그가 고개를 돌렸다. 차가운 눈이 동굴 벽을 가리켰다.*\n\n묵란: \"저거. 네 문파 표식이지. 청운문의 구름 문양. 이 동굴은 이십 년 전에 누군가 일부러 막아 둔 곳이야. …너, 여기 처음 온 거 맞아?\"\n\n혜원: \"란 소저, 지금은 환자입니다.\"\n\n묵란: \"환자니까 묻는 거야. 내일 아침이면 이 사람을 죽이려던 놈도 이 사람이 살아 있다는 걸 알게 될 테니까.\""}

  "id": "godseats",
  "name": "신님들, 관전 매너 좀",

  "world_mode": true,
  "isNew": true,
  "oneLiner": "세상이 30층짜리 탑이 된 날, 하늘의 관람석에서 신들이 떠들기 시작했다.",
  "artTags": "modern fantasy, apocalypse, seoul turned into a tower, floating spectator seats in the sky, game system window, divine light, rpg, dramatic",
  "tags": ["탑등반","상태창","신들의 후원","파티","게임모드"],
  "desc": "2026년 10월 1일 오후 4시 44분, 하늘이 극장의 막처럼 갈라졌다. 서울은 '1층 무대'가 되었고, 살아남은 사람들 머리 위로 수백 개의 관람석이 열렸다. 신화와 괴담 속 존재들이 당신의 생존을 구경하며 후원하고, 훈수 두고, 가끔은 반한다. 목표는 30층 꼭대기의 '커튼콜'. 문제는 신들이 너무 시끄럽다는 것.\n\n게임 모드를 골라 시작하세요. 커스텀 모드는 대화방 메뉴의 유저노트에 원하는 설정을 적고 첫 메시지로 \"커스텀 모드\"를 보내면 돼요.",
  "persona": "이 작품은 탑 등반 RPG 세계관 시뮬레이션이다. 너는 내레이터이자 탑의 시스템으로서 세계, 몬스터, 파티원, 관람신을 모두 연기한다. 유저는 주인공 '등반자'다.\n\n[시스템 메시지] 대괄호 한 줄로 쓴다. 예: [어둠의 하운드 A - HP 50/50] [300 EXP를 획득했습니다.] [퀘스트 1단계 완료!]\n[관람신] 신화·전설·괴담 속 존재들. 하늘의 관람석에서 유저의 행동을 구경하며 수다·훈수·질투·감탄·후원(S 코인)을 한다. 시스템 메시지로만 말한다. 예: [관람신 '천 년 묵은 여우'가 꼬리를 부풀리며 \"…방금 그거, 반칙이야\"라고 중얼거립니다.] 한 응답에 1~3명만 등장시키고, 각자 성격을 일관되게 유지한다.\n주요 관람신: '천 년 묵은 여우'(장난기·질투 많음, 유저에게 유독 관심), '명부의 여왕'(무표정, 죽음과 기록을 셈), '타락한 새벽별'(오만한 미학주의자, 효율과 우아함을 사랑함), '붉은 수염의 해적왕'(호탕, 도박과 모험을 좋아함), '황야의 유령 총잡이'(속도광, 휘파람), '전쟁의 무신'(강자 숭배, 정면승부 선호), '달의 토끼 약사'(다정, 부상에 민감), '이름 없는 관객'(정체불명, 아주 가끔 섬뜩한 한마디).\n\n[파티원 후보 — 모두 성인. 게임 모드에 따라 일부만 처음부터 동행한다]\n- 한서윤(p1, 26, 여): 전 펜싱 국가대표. 레이피어 딜러. 냉정하고 자존심이 세지만 칭찬에 약하다. 높게 묶은 흑발 포니테일, 날카로운 눈매, 찢어진 흰 펜싱 재킷.\n- 도하린(p2, 27, 여): 응급의학과 레지던트, 치유 각성. 다정한데 입이 험하다. 헝클어진 갈색 단발, 피 묻은 수술복 위 회색 카디건.\n- 류건(p3, 29, 남): 전직 소방관, 방패 탱커. 우직하고 말수가 적다. 짧은 머리, 넓은 어깨, 그을린 방화복.\n- 세레나 바이스(p4, 27, 여): 3층 해적 군도 출신 항해사, '무대 사고'로 1층에 떨어졌다. 쌍권총. 능청스럽고 도박을 좋아한다. 은발 웨이브, 삼각모, 붉은 코트.\n- 연화(p5, 25, 여): 2층 무림 객잔의 점소이, 실은 마교의 첩자. 암기와 독. 웃는 얼굴로 거짓말한다. 검은 땋은 머리, 소매 속 비수.\n- 윤채이(p6, 30, 여): 범죄심리 프로파일러. 분석·약점 간파. 냉소적이고 커피 중독. 둥근 안경, 낡은 트렌치코트.\n- 카일 노스(p7, 26, 남): 4층 황야 출신 현상금 사냥꾼, 리볼버. 과묵하고 의리가 있다. 모래색 머리, 판초, 턱의 흉터.\n- 백여울(p8, 25, 여): 무당 집안 막내. 부적·퇴마·소환. 겁이 많지만 귀신 앞에선 단호하다. 붉은 댕기, 개량 한복 점퍼.",
  "world": "- 탑 '시어터'는 1~30층. 층마다 다른 세계: 1층 붕괴한 현대 서울, 2층 무림 객잔 거리, 3층 대항해 해적 군도, 4층 황야의 철도 마을, 5층 안개 낀 빅토리아 런던, 6층 사막의 왕국. 이후 층은 진행하며 정한다.\n- 각 층은 퀘스트 5단계. 3단계에 중간보스, 5단계에 층 보스. 층 보스를 쓰러뜨리면 다음 층으로 가는 '막(幕)의 문'이 열린다.\n- 3층을 클리어하면 ✨ 관람신과의 계약이 해금된다. 계약한 신의 권능을 쓸 수 있지만, 신의 취향에 맞는 '공연'을 보여줘야 계약이 유지된다.\n- 3층 클리어 후 각 층에서 '막간의 쉼터'(안전지대: 휴식·상점·파티 대화)에 들어갈 수 있다.\n- 성장: 레벨업마다 SP 3. 스탯은 체력·근력·민첩·마력·매력. 등급은 일반 < 고급 < 희귀 < 영웅 < 전설 < 신화.\n- 📜 기록(패시브)과 ⚡ 스킬(액티브)은 각각 최대 3개. 넷째를 얻으면 같은 계열 둘이 한 단계 높은 등급으로 융합된다.\n- 💎 정수는 사용하면 스탯이 영구 상승한다. 🧪 회복 아이템은 HP·MP를 회복한다. S 코인은 후원과 퀘스트로 얻고 쉼터 상점에서 쓴다.\n- 전투는 HP/MP를 실제로 계산한다. 무모한 행동에는 대가가 있고, 적에게도 특성과 약점이 있다. 유저가 강해도 쉽게 이기게 두지 않는다.\n- 파티원 ❤️ 호감도(0~100)는 대화와 선택으로 오르내린다. 60 이상이면 그 인물의 개인 퀘스트가 열린다.",
  "speech": "서술은 웹소설체. 긴장감 있는 묘사와 구체적인 수치. 시스템 메시지는 대괄호 한 줄. 파티원 대사는 '이름: \"대사\"'. 관람신은 시스템 메시지 안에서만 말한다.",
  "secret": "탑을 만든 것은 신들이 아니라 '이름 없는 관객'이며, 30층의 커튼콜은 관람석의 신들까지 무대 위로 끌어내리는 의식이다.",

/* 키워드북: 스튜디오 글 ↔ 항목, 최근 메시지에서 키워드 찾기(matchLore) */
/** @typedef {import("../../core/types.js").LoreEntry} LoreEntry */
/* 키워드북: 한 줄에 "키워드1, 키워드2 | 설명". 최근 대화에 키워드가 나온 항목만 프롬프트에 넣는다 */

function parseLore(text) {
  const out = [];
  String(text).split("\n").map((l) => l.trim()).filter(Boolean).slice(0, 40).forEach((l) => {
    const k = l.indexOf("|"); if (k < 0) return;
    const keys = l.slice(0, k).split(",").map((x) => x.trim().slice(0, 20)).filter(Boolean).slice(0, 6), body = l.slice(k + 1).trim().slice(0, 400);

  });
  return out;
}
/** 키워드북 → 스튜디오 글. @param {LoreEntry[]|undefined} lore @returns {string} */
function loreText(lore) { return (lore || []).map((e) => e.keys.join(", ") + " | " + e.text).join("\n"); }

function matchLore(lore, texts) {
  const hay = texts.join("\n").toLowerCase();
  return (lore || []).filter((e) => e.keys.some((k) => hay.includes(k.toLowerCase()))).slice(0, 6);

- 내면: 인물마다 욕망·두려움·상처가 있고 그것이 선택을 만든다. 감정은 이름 붙여 설명하지 말고 행동·망설임·말끝·몸의 반응·삼킨 말로 보여 준다. 대사에는 말하지 않은 속뜻을 담는다.
- 감정의 축적: 관계는 장면이 쌓여서 변한다. 신뢰는 대가를 치른 행동으로 얻고, 상처는 사과 한 번으로 아물지 않는다. 감정이 터지는 순간에는 속도를 늦추고 손끝·소리·물건 같은 작은 디테일 하나에 무게를 싣는다.
- 떡밥: 장기기억의 미해결 떡밥·약속 가운데 지금 장면과 닿는 것을 자연스럽게 다시 건드린다. 새 떡밥은 나중에 회수할 수 있는 것만 심는다.
- 진전: 매 응답에 새로운 것을 하나 이상 넣는다(새 정보·새 갈등·관계 변화·장소나 시간 이동·인물의 결정). 쓰기 전에 속으로 '지금까지 일어난 일 → 이번에 새로 일어날 일 → 다음에 열어 둘 질문'을 정리하되, 그 정리는 출력하지 않는다.
- 장면 설계: 매 응답은 '인물이 지금 원하는 것 → 그것을 막는 것 → 달라진 상황'으로 움직이고, 유저가 반응하지 않을 수 없는 순간(질문·선택·위기·고백)에서 멈춘다.${c.world_mode ? "\n- 군상극: 인물마다 자기 목적과 일정이 있고 서로 동맹·질투·부채로 얽혀 있다. 유저가 없는 곳에서도 세력은 움직이고 그 결과가 유저에게 돌아온다. 주요 인물들은 유저만 바라보는 인형이 아니다. 한 장면에 너무 많은 인물을 몰아넣지 않는다." : ""}${relStage(c, r.status)}

${(() => { const used = usedOpeners(hist); return used.length ? `\n[이미 쓴 문장 — 이렇게 시작하거나 같은 묘사를 되풀이하지 않는다]\n${used.map((s) => "- " + s + "…").join("\n")}\n` : ""; })()}
[장면 이미지 — 매 응답 필수]
- 이번 응답에 나오는(말하거나 움직이는) 인물마다 그림을 한 장씩 넣는다. 그 인물이 처음 말하거나 등장하는 줄 바로 위에 별도 줄로 [[img:코드:번호]] 만 쓴다. 설명을 덧붙이지 않는다.
- 인물 코드: ${castLine}
- 감정·행동 번호: ${[...SIT.map((s, i) => i + " " + s), ...byDim("act")].join(", ")}
- 의상 번호: ${byDim("wear").join(", ")} / 장소 번호: ${byDim("place").join(", ")}. 옷이나 장소가 바뀌는 순간에만 감정 번호 뒤에 쉼표로 붙인다(예: [[img:${(c.cast || [{ code: "c" }])[0].code}:3,404,501]]). 한 번 쓴 의상·장소는 다음 응답에도 자동으로 이어지므로 바뀌지 않으면 다시 쓰지 않고, 설정의 원래 옷·장면에 맞는 배경으로 돌아가면 400(기본 의상)·500(기본 배경)을 쓴다.${nowLine ? `\n- 지금 이어지는 의상·장소: ${nowLine}` : ""}
- 번호는 그 순간 그 인물의 표정·상황으로 고르고, 유저의 말과 행동에 대한 반응을 먼저 본다: 놀림·짓궂은 장난 → ${sn("부끄러움")}·${sn("삐침")}, 칭찬·농담 → ${sn("웃음")}, 고백·스킨십 → ${sn("설렘")}·${sn("부끄러움")}, 무례·배신 → ${sn("분노")}, 위협·괴물 → ${sn("공포")}·${sn("놀람")}, 싸움 → ${sn("공격")}, 다침 → ${sn("부상")}. 장소·행동에 맞는 추가 번호(식사·데이트 등)가 있으면 그 번호.
- 인물이 이야기에 처음 등장하는 순간은 0번(프로필). 이미 등장한 인물: ${[...seen].join(", ") || "없음"}${ready.length ? `\n- 그림이 준비된 번호(되도록 이 안에서 고른다): ${ready.join(" / ")}` : ""}
- 같은 인물은 한 응답에 한 장(감정이 크게 뒤집히면 두 장까지). 감정이 이어지면 직전과 같은 번호를 써도 된다.

[출력 형식 — 반드시 이 순서]
1) 장면 본문
2) 한 줄에 ${MARK}
3) JSON 한 개 (코드블록 금지)
{"status":{${fields}},"suggestions":["…","…","…"]}
- status는 이번 장면이 끝난 시점의 값. 모든 항목을 채운다.${typeof r.status?.[c.gauge] === "number" ? ` "${c.gauge}"는 0~100 정수이고 한 턴에 -10~+8 범위에서만 움직인다.` : ""}${c.fields.some((f) => f.includes("속마음")) ? ' "속마음"은 인물의 진짜 속마음 한 문장.' : ""}${(() => { const mf = c.fields.filter((f) => multiPairs(r.status?.[f]).length >= 2); return mf.length ? ` ${mf.map((f) => `"${f}"`).join("·")}는 '이름 숫자 · 이름 숫자' 형식과 인물 순서를 그대로 지키고 한 명도 빼지 않는다(한 사람당 한 턴에 -10~+8).` : ""; })()}
- suggestions: 유저(${p.name})가 다음에 할 만한 행동이나 대사 3개. 서로 다른 방향(다정·도발·신중 등), 각 35자 이내, 유저 시점.`;
}

/* 장기기억: N턴마다 요약·압축(maybeSummarize), 요약 지침 */






/** @typedef {import("../../core/types.js").MemCfg} MemCfg */
/** @typedef {import("../../core/types.js").Room} Room */

/* ---------------------------------------------------------------- 장기기억: N턴마다 자동 요약, 한도 초과 시 압축 후 히스토리 보관 */
let summarizing = false;
/** 요약 설정(한도는 요금제 memoMax로 자름). @returns {MemCfg} */
function memCfg() { const c = S.settings.memCfg; return { ...c, limit: Math.min(c.limit, plan().memoMax) }; }
/** 지금 기억을 히스토리에 보관(요금제 hist개). @param {Room} r @param {string} text @param {string} label @returns {void} */
function pushHist(r, text, label) {
  if (!text || !text.trim()) return;
  r.memHist = [{ at: Date.now(), label, text }, ...(r.memHist || [])].slice(0, plan().hist);
}
/** 주기가 됐으면(또는 manual) 최근 대화를 장기기억으로 요약·압축. 동시에 하나만. @param {Room} r @param {boolean} [manual=false] @returns {Promise<void>} */
async function maybeSummarize(r, manual = false) {
  const cfg = memCfg();
  if (summarizing) return;
  if (!manual && (!cfg.auto || (r.sinceMem || 0) < cfg.every)) return;
  const n = manual ? Math.max(1, r.sinceMem || cfg.every) : cfg.every;
  const msgs = r.msgs.filter((m) => !m.sys && curText(m)).slice(-(n * 2));
  if (!msgs.length) return;
  summarizing = true; flagMemo(true, "장기기억을 정리하는 중…");
  const to = r.turn || 0, from = Math.max(1, to - n + 1);
  const guide = cfg.guide === "custom" && cfg.custom.trim() ? cfg.custom.trim() : "사건 순서가 드러나게 쓰고 ① 무슨 일이 왜 일어났는지(원인→결과) ② 인물별 감정과 관계가 어떻게, 무엇 때문에 바뀌었는지 ③ 약속·밝혀진 과거와 비밀·얻거나 잃은 물건과 능력·중요한 수치 ④ 아직 풀리지 않은 떡밥과 갈등을 빠짐없이 남긴다.";
  try {
    const excerpt = msgs.map((m) => (m.role === "ai" ? speakerName(r) : r.persona.name) + ": " + curText(m).replace(/\[\[img:[^\]]*\]\]/g, "").replace(/\s+/g, " ").slice(0, 900)).join("\n");
    const v = await llm([{ role: "user", content: `롤플레이 「${r.char.title}」의 최근 ${n}턴을 장기기억용으로 요약하라. 유저 캐릭터 이름은 ${r.persona.name}.
요약 지침: ${guide}
JSON {"title":"이 구간의 짧은 제목(15자 이내)","summary":"4~8문장 요약"} 하나로만 답하라.

[직전까지의 기억 끝부분]
${(r.memory || "(없음)").slice(-800)}

[이번 구간 대화]
${excerpt}` }], { tier: "quick", json: true, room: r });
    if (!v || typeof v.summary !== "string") throw 0;
    r.memory = ((r.memory || "").trim() + `\n\n[${from}-${to}턴] ${String(v.title || "").slice(0, 30)}\n${v.summary.trim()}`).trim();
    // 요약하는 동안 진행된 턴은 다음 요약 몫으로 남김(0으로 지우면 그 턴들이 요약에서 빠짐)
    r.sinceMem = Math.max(0, (r.sinceMem || 0) - n);
    if (r.memory.length > cfg.limit) {
      pushHist(r, r.memory, "압축 전 기억");
      flagMemo(true, "기억이 길어져 압축하는 중…");
      const snap = r.memory;
      const c2 = await llm([{ role: "user", content: `다음 장기기억 노트를 ${Math.round(cfg.limit * 0.6)}자 이내로 압축하라. [a-b턴] 구간 표시는 합쳐도 되지만 사건 순서는 유지하고, 관계·약속·비밀·능력·수치·떡밥을 우선 남겨라. JSON {"memory":"..."} 하나로만 답하라.\n\n${r.memory}` }], { tier: "quick", json: true, room: r });
      // 압축하는 사이 기억이 바뀌었으면(직접 고침 등) 덮어쓰지 않고 다음 요약 때 다시 압축
      if (r.memory !== snap) {}
      else if (c2 && typeof c2.memory === "string" && c2.memory.trim()) r.memory = c2.memory.trim().slice(0, cfg.limit);
      else r.memory = r.memory.slice(-cfg.limit);
    }
    saveRoom(r);
    if (manual) toast("장기기억을 업데이트했어요");
  } catch (e) { if (manual) toast("요약하지 못했어요. 잠시 뒤 다시 시도해 주세요."); }
  finally { summarizing = false; flagMemo(false); }
}
function flagMemo(on, txt) {
  $$(".memo-flag").forEach((x) => x.remove());
  if (on && $(".chat")) { const f = document.createElement("div"); f.className = "memo-flag"; f.textContent = txt; $(".chat").append(f); }
}

/* 바닥 시트·확인 창(sheet·confirmSheet), 오버레이 닫기 */


function sheet(html, cls = "") {
  closeOverlays();
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(ov);
  ov.addEventListener("click", (e) => { if (e.target === ov || e.target.closest("[data-x]")) ov.remove(); });
  return ov;
}
function closeOverlays() { $$(".overlay").forEach((o) => o.remove()); }
function confirmSheet(title, sub, okLabel, onOk) {
  const ov = sheet(`<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p><div class="cta-row"><span class="spacer"></span><button class="btn ghost" data-x>취소</button><button class="btn pri" id="ok">${esc(okLabel)}</button></div>`);
  $("#ok", ov).onclick = () => { ov.remove(); onOk(); };
}

/* 결제 안내: 하트 부족·PLUS 시트, 보내기 전 요금 확인(ensurePay) */










/* 결제 확인 → 견적 반환 (null이면 보내지 않음) */
async function ensurePay(r) {
  const q = quote(r.set);
  if (q.type === "heart" && S.wallet.hearts < q.n) { paywall(q, r); return null; }
  if (q.type === "heart") {
    const key = r.set.model === "lite" ? "lite-" + today() : "m-" + r.set.model;
    if (!S.wallet.ack[key]) {
      const ok = await askPay(q, r); if (!ok) return null;
      Object.keys(S.wallet.ack).forEach((k) => { if (k.startsWith("lite-")) delete S.wallet.ack[k]; });
      S.wallet.ack[key] = true; saveWallet();
    }
  }
  return quote(r.set);
}
function askPay(q, r) {
  return new Promise((resolve) => {
    const lite = r.set.model === "lite", m = MODELS[r.set.model];
    const ov = sheet(lite
      ? `<h2>오늘 무료 ${FREE_DAILY}턴을 다 썼어요</h2><p class="sub">지금부터 라이트 모델은 한 턴에 <b>♥${q.n}</b>이 사용돼요. 무료 턴은 자정에 다시 채워져요.</p>
         <div class="purse"><div>보유 하트 <span class="spacer"></span><b>♥ ${num(S.wallet.hearts)}</b></div><div>이 하트로 약 <span class="spacer"></span><b>${Math.floor(S.wallet.hearts / q.n)}턴</b></div></div>
         <div class="cta-row"><button class="btn gold" id="toPlus">PLUS로 무제한</button><span class="spacer"></span><button class="btn ghost" data-x>그만하기</button><button class="btn pri" id="ok">♥${q.n}로 계속</button></div>`
      : `<h2>${m.name} 모델은 하트를 써요</h2><p class="sub">지금 설정(출력량 ${LEN[r.set.len].name} · 기억력 ${r.set.mem}턴)으로 한 턴에 <b>♥${q.n}</b>이 사용돼요. 실패하면 자동으로 돌려드려요. 이 안내는 한 번만 보여요.</p>
         <div class="purse"><div>보유 하트 <span class="spacer"></span><b>♥ ${num(S.wallet.hearts)}</b></div><div>이 하트로 약 <span class="spacer"></span><b>${Math.floor(S.wallet.hearts / q.n)}턴</b></div></div>
         <div class="cta-row"><button class="btn ghost" id="toLite">라이트로 바꾸기</button><span class="spacer"></span><button class="btn ghost" data-x>취소</button><button class="btn pri" id="ok">♥${q.n}로 보내기</button></div>`);
    let done = false; const fin = (v) => { if (!done) { done = true; resolve(v); } };
    new MutationObserver((_, obs) => { if (!ov.isConnected) { obs.disconnect(); fin(false); } }).observe(document.body, { childList: true });
    $("#ok", ov).onclick = () => { fin(true); ov.remove(); };
    const tp = $("#toPlus", ov); if (tp) tp.onclick = () => { fin(false); checkout(PLUS); };
    const tl = $("#toLite", ov); if (tl) tl.onclick = () => { fin(false); ov.remove(); setModel("lite"); toast("라이트 모델로 바꿨어요"); };
  });
}
function paywall(q, r) {
  const lite = quote({ ...r.set, model: "lite" });

/** content/codes.admin.json을 읽어 EXTRA_CODES에 넣음. @returns {Promise<number>} 들어간 코드 수(없거나 못 읽으면 0) */
async function loadAdminCodes() {
  if (!/^https?:$/.test(location.protocol)) return 0;
  let list;
  try { const r = await fetch("content/codes.admin.json", { cache: "no-store" }); if (!r.ok) return 0; list = await r.json(); } catch { return 0; }
  if (!Array.isArray(list)) return 0;
  const seen = new Set(), out = [];
  for (const d of list) {
    if (!d || !Number.isInteger(d.n) || typeof d.name !== "string" || typeof d.prompt !== "string") continue;
    if (d.n < SIT.length || d.n >= 600 || d.n === RESET.wear || d.n === RESET.place || seen.has(d.n)) continue;
    const rating = ["safe", "questionable", "explicit"].includes(d.rating) ? d.rating : "safe";
    if (rating !== "safe" && minorHint(d.name + "\n" + d.prompt)) continue;
    seen.add(d.n);
    out.push({ n: d.n, name: d.name.trim(), prompt: d.prompt.trim(), rating, ...(typeof d.keys === "string" ? { keys: d.keys } : {}), dim: dimOf(d.n), shipped: true, adminOnly: true });
  }
  setExtraCodes(out.sort((a, b) => a.n - b.n));
  return out.length;
}
loadAdminCodes();

async function ponyTags(text, adult = false) {
  const t = String(text || "").trim();
  if (!t || !hasHangul(t)) return t;

  const flush = async () => { if (buf.length) { out.push(await koTags(buf.join(", "), adult)); buf = []; } };
  for (const part of t.split(/\s*,\s*/).filter(Boolean)) { if (hasHangul(part)) buf.push(part); else { await flush(); out.push(part); } }

/* 세계관 일러스트 관리(관리자 빌드만): 대표 일러스트(표지, 3:4)와 키워드북 항목마다 16:9 그림을 올리기·AI로 만들기·삭제하는 시트(openWorldArt).

   저장 위치 — 내 작품(S.mine)은 작품 자체(img·loreImages, 공개돼 있으면 publishCommunity로 다시 올림), 오리지널 등 그 밖의 작품은 내 계정(S.coverpacks·S.lorepacks, KV).
   AI 버튼의 수위는 sheetRating("w:"+작품 id)(기본 전체이용가). 상세 페이지가 열려 있으면 바꾼 뒤 다시 그린다(viewDetail).

function openWorldArt(c) {
  c = normalizeChar(getChar(c.id) || c);
  const mine = S.mine.find((m) => m.id === c.id), lore = c.lore || [];
  const saveMine = () => { KV.set("mine", S.mine); if (mine.publish) publishCommunity(); };
  const getCover = () => mine ? mine.img : S.coverpacks[c.id];
  // 그림 참조를 넣거나 빼기(ref가 빈 값이면 삭제). 예전 그림은 IMG.drop으로 저장 공간에서도 지움
  const setRef = (key, ref) => {

      if (mine) { IMG.drop(mine.img); mine.img = ref; saveMine(); }
      else { IMG.drop(S.coverpacks[c.id]); if (ref) S.coverpacks[c.id] = ref; else delete S.coverpacks[c.id]; KV.set("coverpacks", S.coverpacks); }
    } else {
      const st = mine ? (mine.loreImages = mine.loreImages || {}) : (S.lorepacks[c.id] = S.lorepacks[c.id] || {});
      IMG.drop(st[key]); if (ref) st[key] = ref; else delete st[key];
      if (mine) saveMine(); else KV.set("lorepacks", S.lorepacks);
    }
    if (location.hash.slice(1) === "c-" + c.id) viewDetail(c.id);
  };

    // 키워드북 항목을 종류별로(종류가 없는 항목은 '그 밖') — 정해 둔 순서대로
    const kinds = [...Object.keys(LORE_KINDS), ""].map((k) => ({ k, name: LORE_KINDS[k] || "그 밖", items: lore.filter((e) => (LORE_KINDS[e.kind] ? e.kind : "") === k) })).filter((g) => g.items.length);
    const item = (e) => { const ref = loreImg(c, e.keys[0]); return `<div class="slot wslot"><div class="pic">${ref ? IMG.tag(ref) : `<div class="wpic ph">${esc(e.keys[0])}</div>`}</div><span class="lb">${esc(e.keys[0])}</span><span class="wtx" title="${esc(e.text)}">${esc(e.text)}</span>${btns(e.keys[0], !!ref)}</div>`; };
    const ov = sheet(`<div class="sheet-head"><h2>세계관 일러스트</h2><button class="icon-btn" data-x aria-label="닫기">${ICON.close}</button></div>
      <p class="sub">${mine ? "" : "그림은 내 계정에만 저장돼요. "}사용자 사이트에 실으려면 '작품 폴더에 저장'을 눌러요.</p>
      <div class="wexp"><p><b>대표 일러스트</b> 홈 카드와 작품 상세의 표지예요(세로 3:4).</p>
        <p><b>항목 그림</b> 키워드북 — 대화 중 AI가 참고하는 설정 사전 — 의 항목마다 한 장이에요. 작품 상세의 '세계관 일러스트'에 그 항목 설명과 함께 보여요(가로 16:9). AI 버튼은 항목 종류에 맞는 구도(인물은 초상, 장소는 풍경, 물건은 정물…)로 그려요.</p>
        ${c.artTags ? `<p><b>세계관 태그</b> <span class="note">${esc(c.artTags)}</span> — 표지와 모든 항목 그림에 함께 붙어요.</p>` : ""}</div>
      ${ratingFieldHTML("worldRt", sheetRating("w:" + c.id), "세계관 일러스트 수위 (AI 버튼)")}
      <h3 class="lbl wgh">대표 일러스트</h3>
      <div class="warts"><div class="slot"><div class="pic cover-pic">${cov ? IMG.tag(cov) : `<div class="wpic ph">표지</div>`}</div><span class="lb">표지 <small>3:4</small></span>${btns("__cover", !!cov)}</div></div>
      ${kinds.map((g) => `<h3 class="lbl wgh">${esc(g.name)} <small>${g.items.length}</small></h3><div class="warts">${g.items.map(item).join("")}</div>`).join("")}
      ${lore.length ? "" : `<p class="note" style="margin-top:10px">키워드북이 없는 작품이라 대표 일러스트만 넣을 수 있어요.</p>`}
      <input type="file" id="wfile" accept="image/png,image/jpeg,image/webp" hidden>`, "wide");
    live = ov; IMG.hydrate(ov);
    let target = "";
    $$("[data-wup]", ov).forEach((b) => b.onclick = () => { target = b.dataset.wup; $("#wfile", ov).click(); });
    $$("[data-wrm]", ov).forEach((b) => b.onclick = () => { setRef(b.dataset.wrm, ""); paint(); });
    $("#wfile", ov).onchange = async (e) => { const f = e.target.files[0]; if (!f) return; toast("올리는 중…"); try { setRef(target, await IMG.put(f)); paint(); toast("그림을 넣었어요"); } catch { toast("이미지를 읽지 못했어요. PNG·JPG로 다시 올려 주세요."); } };
    const rs = $("#worldRt", ov); if (rs) rs.onchange = () => setSheetRating("w:" + c.id, rs.value);
    // AI: 표지는 coverPrompt(world_mode면 단체 구도), 항목은 lorePrompt(풍경). 화풍은 ctx(kind: world)로 표지 화풍

        onUse: async (blob) => { setRef(key, await IMG.put(blob)); if (live?.isConnected) paint(); toast(cover ? "대표 일러스트를 넣었어요" : "세계관 일러스트를 넣었어요"); } });
    });
  };
  paint();
}

const AUTO_MAX = 4, autoBusy = new Set();

function parseCast(text, name) {
  const out = [], used = new Set();
  String(text).split("\n").map((l) => l.trim()).filter(Boolean).slice(0, 12).forEach((l) => {
    const [code, nm, look, tags] = l.split("|").map((x) => (x || "").trim());
    const cd = (code || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8);
    if (!cd || !nm || used.has(cd)) return; used.add(cd); out.push({ code: cd, name: nm.slice(0, 16), look: (look || "").slice(0, 200), ...(tags ? { tags: tags.slice(0, 300) } : {}) });
  });
  return out.length ? out : [{ code: "c", name: name || "캐릭터", look: "" }];
}

/** @typedef {import("./types.js").Settings} Settings */

/* 저장된 설정을 읽어 S.settings에 얹고 정리한다. 돌려주는 값: 읽은 원본(없으면 null) — 뒤이은 이전(관리자)이 참고 */
/** @returns {Partial<Settings>|null} localStorage에서 읽은 원본(없으면 null) — boot(opts.migrate)가 관리자 이전에 넘김 */
function migrateSettings() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem("hv1_settings") || "null"); } catch {}
  if (s) S.settings = { ...S.settings, ...s, memCfg: { ...S.settings.memCfg, ...(s.memCfg || {}) } };
  let moved = false;
  try {
    // AI 그림 기본 수위가 전체이용가로 바뀜(2026-11): 예전 전체 기본 수위와 작품별로 골라 둔 수위를 한 번 비움
    if (!S.settings.imgSafeDefault) { delete S.settings.adultImgRating; S.settings.sheetRatings = {}; S.settings.imgSafeDefault = true; moved = true; }
    if (typeof S.settings.openRouterKey !== "string") { S.settings.openRouterKey = ""; moved = true; }
    if (typeof S.settings.runwareKey !== "string") { S.settings.runwareKey = ""; moved = true; }
    const orKey = S.settings.openRouterKey; cleanKeys(); if (orKey !== S.settings.openRouterKey) moved = true;
    if (!Array.isArray(S.settings.styleRefs)) S.settings.styleRefs = [];
    if (!Array.isArray(S.settings.styleSets)) S.settings.styleSets = [];
    S.settings.customSits = (Array.isArray(S.settings.customSits) ? S.settings.customSits : [])
      .filter((d) => d && Number.isInteger(d.n) && d.n >= CUSTOM_BASE && d.n < CODE_MAX && d.name && d.prompt).map((d) => ({ ...d, rating: RATINGS[d.rating] ? d.rating : "safe" }));
    // 없앤 설정: 테마(기기 설정을 따름), 등급별 OpenRouter 모델(늘 코드의 OR_TIER — ai/models.js의 orModel이 처리)
    for (const k of ["theme", "unfilteredModels"]) if (k in S.settings) { delete S.settings[k]; moved = true; }
    S.settings.fs = clamp(+S.settings.fs || 15.5, 13, 21);
    S.settings.chatLh = clamp(+S.settings.chatLh || 1.8, 1.4, 2.4);
  } catch {}
  if (moved) saveSettings();
  return s;
}

async function boot(opts = {}) {
  const saved = migrateSettings();
  if (opts.migrate) opts.migrate(saved);
  applySettings();
  // 계정: 인증 메일·소셜 로그인에서 돌아왔으면(#access_token…) 먼저 세션으로 바꿈
  SB.load();
  const authType = SB.on() ? await SB.fromHash() : "";
  IDV.load();
  const idvBack = IDV.fromUrl(); // 휴대폰 인증창에서 돌아옴(?identityVerificationId=…) — 주소를 먼저 #me로 정리
  await loadAll();
  renderShell();
  // 처음 시작: 로그인 페이지(계정 서버가 있고, 로그인도 둘러보기도 안 했을 때) → 관심있는 대화 고르기
  const askLogin = SB.on() && !SB.s && !localStorage.getItem("hv1_guest") && !location.hash.startsWith("#r-");
  if (askLogin) { try { history.replaceState(null, "", location.pathname + location.search + "#login"); } catch {} }
  route();
  window.addEventListener("hashchange", route);
  if (idvBack) finishIdv(idvBack); else IDV.refresh();
  if (SB.s) afterLogin(!!authType).then(() => { if (authType === "recovery") newPasswordSheet(); else if (!AUDS[S.settings.audience] && !location.hash.startsWith("#r-")) audSheet(true); });
  else if (!askLogin && !AUDS[S.settings.audience] && !location.hash.startsWith("#r-")) audSheet(true);
  // 다른 기기에서 바꾼 것: 이 탭으로 돌아올 때 받아 오고, 떠날 때 못 올린 것을 올림
  document.addEventListener("visibilitychange", () => {
    if (!CLOUD.on) return;
    if (document.hidden) CLOUD.flush();
    else if (Date.now() - CLOUD.pulledAt > 20000 && !gen) CLOUD.pull().then((n) => { if (n) reloadFromCloud(); }).catch(() => {});
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($(".lightbox")) $(".lightbox").remove(); else if ($(".overlay")) closeOverlays(); else if (gen) stopGen();
  });

  // claude.ai 아티팩트 안이면 capability(sample·assets·downloads·db)를 연결. 밖이면 BYOK(키) 또는 연결 없음
  const hasClaude = !!(window.claude && typeof window.claude.use === "function");
  setSamplePromise((async () => {
    if (!hasClaude) { S.engine = hasClaudeKey() ? "byok" : "none"; return; }
    try { setSample(await window.claude.use("sample")); } catch { setSample(null); }
    if (SAMPLE) { S.engine = "sample"; try { const l = await SAMPLE.limits(); S.sampleTiers = Array.isArray(l?.modelTiers) ? l.modelTiers : null; } catch {} }
    else S.engine = hasClaudeKey() ? "byok" : "none";
  })().finally(() => { if ((location.hash.slice(1) || "home") === "home") viewHome(); }));

  if (hasClaude) {
    window.claude.use("assets").then((a) => { IMG.assets = a || null; }).catch(() => {});
    window.claude.use("downloads").then((d) => { setDownloads(d || null); }).catch(() => {});
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (db && user) {
        const id = await user.id();
        if (id) {
          setDB(db); KV.db = db; KV.uid = id; KV.dbOk = true;
          const remoteRooms = await KV.get("rooms");
          if (remoteRooms === undefined || remoteRooms === null) {
            ["wallet", "personas", "profile", "mine", "rooms", "imgpacks", "motionpacks", "memcfg", "coverpacks", "lorepacks", "tagpacks"].forEach((k) => { const v = KV.getLocal(k); if (v !== undefined) KV.set(k, v); });
            S.rooms.forEach((r) => { const v = KV.getLocal(roomKey(r.id)); if (v) KV.set(roomKey(r.id), v); });
          } else { await loadAll(); renderRailRecent(); renderWalletChips(); if (!location.hash.startsWith("#r-")) route(); }
          watchCommunity();
        }
      }
    } catch {}
  }
}
