/* 고정 기억(핀): 이용자가 한 줄로 박아 두는 '꼭 기억할 것' — 고정 시트(pinSheet)와 드로어 장기기억의 목록(pinsHTML·bindPins).
   방의 r.pins [{ id, text, at, msgId? }]에 저장하고 프롬프트 변동부의 [고정 기억]으로 매 턴 그대로 보냄(요약·압축은 건드리지 않음). 한도는 글자 LIMITS.pin, 개수 plan().pins —
   PLUS가 끝나 한도보다 많이 남은 줄은 지우지 않고 '보관 중'으로 보이며 AI에는 앞의 한도 개수만 감(ai/prompt/rules.js) */







/** @typedef {import("../core/types.js").Message} Message */
/** @typedef {import("../core/types.js").Pin} Pin */
/** @typedef {import("../core/types.js").Room} Room */

/* 메시지 앞부분을 한 줄로(그림 태그·서식 기호를 빼고) — 고정 시트의 처음 값. 이용자가 고쳐서 저장함 */
const seed = (m) =>
  curText(m)
    .replace(/\[\[[^\]]*\]\]/g, " ")
    .replace(/[*"“”]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, 100);
/**
 * 고정 기억 시트 — 새로 고정(m을 주면 그 메시지 앞부분을 채움, 없으면 빈 칸)하거나 pin을 고침. 저장하면 after().
 * 개수가 한도(plan().pins)면 새로 고정하지 않고 안내(무료는 PLUS 안내, PLUS는 알림).
 * @param {Room} r @param {Message|null} m @param {() => void} [after] @param {Pin} [pin] 고칠 항목
 */
function pinSheet(r, m, after, pin) {
  const pins = r.pins || [];
  if (!pin && pins.length >= plan().pins) {
    if (isPro()) toast(`고정 기억은 대화방마다 ${plan().pins}개까지예요. 덜 중요한 것을 지우고 다시 해 주세요.`);
    else plusSheet("pins");
    return;
  }
  const ov = sheet(
    `<div class="sheet-head"><h2>${pin ? "고정 기억 고치기" : "기억에 고정"}</h2><button class="icon-btn" data-x aria-label="닫기">${ICON.close}</button></div>
    <p class="sub">꼭 기억해야 할 것을 한 줄로 적어 두면, 요약으로 흐려지지 않고 매 턴 그대로 AI에게 전해져요. (${pins.length + (pin ? 0 : 1)} / ${plan().pins}개)</p>
    <div class="field"><label for="pinTa" style="display:flex">고정할 내용<span class="spacer"></span>` +
      `<span class="memo-count" id="pinCnt"></span></label>` +
      (`<textarea id="pinTa" maxlength="${LIMITS.pin}" style="min-height:96px" placeholder="예: 첫눈 오는 날 다시 만나기로 약속했다.">` +
        `${esc(pin ? pin.text : m ? seed(m) : "")}</textarea></div>
    <div class="cta-row"><span class="spacer"></span><button class="btn ghost" data-x>취소</button><button class="btn pri" id="pinSave">저장</button></div>`)
  );
  const ta = $("#pinTa", ov),
    upd = () => {
      $("#pinCnt", ov).textContent = num(ta.value.length) + " / " + num(LIMITS.pin);
    };
  ta.oninput = upd;
  upd();
  ta.focus();
  $("#pinSave", ov).onclick = () => {
    const text = ta.value.replace(/\s+/g, " ").trim().slice(0, LIMITS.pin);
    if (!text) {
      ta.focus();
      return;
    }
    if (pin) pin.text = text;
    else r.pins = pins.concat({ id: uid("pin"), text, at: Date.now(), ...(m ? { msgId: m.id } : {}) });
    saveRoom(r);
    ov.remove();
    toast(pin ? "고정 기억을 고쳤어요" : "기억에 고정했어요. 다음 턴부터 반영돼요.");
    after && after();
  };
}
/** 드로어 장기기억의 '고정 기억' 탭: 목록(수정·삭제)과 한도, 직접 추가 버튼. @param {Room} r @returns {string} */
function pinsHTML(r) {
  const pins = r.pins || [],
    max = plan().pins,
    over = Math.max(0, pins.length - max);
  return (
    `<b>압축하지 않고 매 턴 그대로 전하는 기억이에요</b>` +
    (`<p class="note" style="margin:4px 0 12px">대화의 말풍선 아래 📌 고정으로 담거나 여기서 직접 적어요. ${pins.length} / ${plan().pins}개 · 각 ` +
      `${num(LIMITS.pin)}자${!isPro() ? ` (PLUS ${PLAN.pro.pins}개)` : ""}</p>
    ${
      over
        ? `<p class="note" id="pinOver" style="margin:-6px 0 12px">지금 한도(${max}개)를 넘은 ${over}개는 ` +
          `<b>보관 중</b>이에요 — AI에는 앞의 ${max}개만 전해요. 덜 중요한 것을 지우면 뒤의 것이 올라오고, PLUS가 되면 모두 다시 전해요.</p>`
        : ""
    }
    ${
      pins.length
        ? `<div class="pin-list">${pins
            .map(
              (p, i) =>
                `<div class="pin-row${i >= max ? " off" : ""}">` +
                `<p>${i >= max ? '<span class="pill">보관 중</span> ' : ""}${esc(p.text)}</p>` +
                `<button class="btn sm ghost" data-pined="${esc(p.id)}">수정</button>` +
                `<button class="btn sm ghost danger" data-pindel="${esc(p.id)}">삭제</button></div>`
            )
            .join("")}</div>`
        : `<div class="empty">아직 고정한 기억이 없어요. 약속·비밀·호칭처럼 잊으면 안 되는 것을 고정해 두세요.</div>`
    }
    <button class="btn block" id="pinAdd" style="margin-top:10px">+ 고정 기억 추가</button>`)
  );
}
/** pinsHTML의 버튼 연결 — 바뀌면 repaint(). @param {HTMLElement} body @param {Room} r @param {() => void} repaint */
function bindPins(body, r, repaint) {
  $("#pinAdd", body).onclick = () => pinSheet(r, null, repaint);
  $$("[data-pined]", body).forEach(
    (b) =>
      (b.onclick = () =>
        pinSheet(
          r,
          null,
          repaint,
          (r.pins || []).find((p) => p.id === b.dataset.pined)
        ))
  );
  $$("[data-pindel]", body).forEach(
    (b) =>
      (b.onclick = () => {
        r.pins = (r.pins || []).filter((p) => p.id !== b.dataset.pindel);
        saveRoom(r);
        repaint();
      })
  );
}

    ).length;

  return (

    row("고정 기억", sent + "줄" + (pins > sent ? ` · ${pins - sent}줄은 한도를 넘어 안 보내요` : "")) +

}

/** chatSettingsHTML로 넣은 칸에 동작을 붙임 — 바꾸는 즉시 저장·반영. @param {HTMLElement} root 그 칸이 들어 있는 요소 @param {() => void} [after] 바뀐 뒤 부를 것(대화방의 입력창 안내 갱신 등) */
function bindChatSettings(root, after) {
  const set = (k, val) => {
    if (val === "")
      delete S.settings[k]; // 화면 테마의 '기기 설정' — 칸을 지움
    else S.settings[k] = val;
    saveSettings();
    applySettings();
    if (after) after();
  };
  $("#cfs", root).oninput = (e) => {
    set("fs", +e.target.value);
    $("#cfsV", root).textContent = e.target.value + "px";
  };
  $$("[data-set] button", root).forEach(
    (b) =>
      (b.onclick = () => {
        const k = b.parentElement.dataset.set;
        set(k, k === "chatLh" ? +b.dataset.v : b.dataset.v);
        $$("button", b.parentElement).forEach((x) => x.classList.toggle("on", x === b));
      })
  );
  $("#cEnter", root).onchange = (e) => set("enterSend", e.target.checked);
  $("#cImg", root).onchange = (e) => set("sceneImg", e.target.checked);
}

/* 처음 로그인의 올리기(pushAll): 이 기기의 데이터와 그림을 계정에 올림 — 계정이 비었을 때·합칠 때(ui/account.js firstSync). 전송은 CLOUD의 줄(한 번에 하나)에 세움 */







/**
 * 이 기기의 모든 데이터를 계정에 올림(계정이 비었을 때·합칠 때). 그림은 계정에 없는 것만 읽어 **같은 대기열**(CLOUD.put)에 올림 — 전송은 한 번에 하나로 서고,
 * 실패하면 대기열에 남아 다시 올라가며, 로그아웃도 그것을 '못 올린 것'으로 봄(전에는 그림을 따로 보내, 실패한 그림이 대기열에 남지 않았음).
 * 그림 본문은 IndexedDB에, IndexedDB가 막힌 브라우저에서는 localStorage에 있음. 못 올렸으면 던짐 — 부른 쪽(처음 로그인)이 '저장했어요'라고 하지 않게.
 * @param {string[]} [keys] 올릴 KV 키(빼면 이 기기의 것 전부 — 방은 목록에 있는 것만, 주면 그 키와 설정·그림) @returns {Promise<void>}
 */
async function pushAll(keys) {
  // 덜 끝난 표시(올리려던 키와 함께): 대기열에 넣기 전에 실패하면 대기열에는 흔적이 없음 — 표시가 남아 있으면 로그아웃·'지금 동기화'가 같은 키로 다시 올림(ui/account.js uploadAll)
  CLOUD.owed = { keys: keys || null };
  try {
    localStorage.setItem("hv1_cloudowed", JSON.stringify({ uid: CLOUD.uid, keys: keys || null }));
  } catch {}
  for (const k of keys || localKVKeys()) {
    const s0 = CLOUD.putSeq[k] || 0;
    let v;
    try {
      v = await KV.get(k, true); // 방 본문은 큰 저장소에서(못 읽으면 던짐 — '없음'과 구별), 그 밖은 localStorage에서
    } catch {
      throw { code: "push_failed" }; // 본문을 읽지 못함 — 목록만 올리고 저장했다고 하지 않게
    }
    // 읽는 사이 이 기기에서 바뀐 키는(대기열에 있든, 이미 올라갔든) 방금 읽은 옛 값으로 덮지 않음
    if (v !== undefined && !(k in CLOUD.pending) && !CLOUD.sending.has(k) && (CLOUD.putSeq[k] || 0) === s0) CLOUD.pending[k] = { v };
  }
  CLOUD.pending.settings = { v: cloudSettings() };
  if ((await CLOUD.flush()) !== "ok") throw { code: "push_failed" };
  const uid = CLOUD.uid,
    have = new Set(await CLOUD.imgKeys());
  let ls = [];
  try {
    ls = Object.keys(localStorage)
      .filter((k) => k.indexOf("hv1_img") === 0)
      .map((k) => k.slice(4));
  } catch {}
  const mine = Array.from(new Set((await IDB.keys()).concat(ls))).filter((k) => IMG_KEY_RE.test(k) && !have.has(k));
  // shortcut: 그림을 한꺼번에 대기열에 올림(페르소나 사진 몇 장), 그림이 많아지면 묶음마다 flush
  for (const k of mine) {
    let v = await IDB.get(k);
    if (typeof v !== "string") v = KV.getLocal(k);
    if (CLOUD.uid !== uid) throw { code: "push_failed" }; // 읽는 사이 계정이 바뀜
    if (typeof v === "string" && validRef(v)) CLOUD.put(k, v);
  }
  if ((await CLOUD.flush()) !== "ok") throw { code: "push_failed" };
  if (CLOUD.uid !== uid) return;
  CLOUD.owed = null;
  try {
    localStorage.removeItem("hv1_cloudowed");
  } catch {}
}
// 이 기기의 KV 키 중 계정과 주고받는 것(그림은 pushAll이 따로, 설정은 "settings" 키로 따로). 방 본문은 저장소를 훑지 않고 **이 기기의 목록(S.rooms)에 있는 방만** —
// 목록에 없는 본문(지우다 남은 것, '계정 것만 쓰기'로 목록에서 뺀 것)이 계정으로 올라가지 않게
function localKVKeys() {
  let ls = [];
  try {
    ls = Object.keys(localStorage)
      .filter((k) => k.indexOf("hv1_") === 0)
      .map((k) => k.slice(4))
      .filter((k) => k.indexOf("room-") !== 0);
  } catch {}
  return Array.from(new Set(ls.concat(S.rooms.map((r) => roomKey(r.id))))).filter(synced);
}

/* 처음 로그인: 계정이 비었으면 이 기기 데이터를 올리고, 이 기기에만 있는 대화나 찜한 작품이 있으면 합칠지 물음(2026-11-10 사용자 결정: 찜도 묻기 —

  const local = { rooms: S.rooms.filter((r) => !isTomb(remote[roomKey(r.id)])), personas: S.personas };

  const rs = mergeShelf(remote.shelf),

    const done =

function checkout(item, after) {

    `<h2>결제하기</h2><p class="sub">${esc(item.name)}${item.id === "plus" ? ` · 하트 ${PLUS_MONTHLY}개 포함<br>${PLUS_SUG_NOTE}` : ""}</p>

    <div class="sumrow"><span>부가세</span><span>${won(vat)}</span></div>

      `<input type="radio" name="pm"> 휴대폰 결제</label>
    </div>
    <p class="demo-note">데모 결제예요. 결제 정보를 받지 않고, 실제로 청구되지 않아요.</p>
    <div class="cta-row"><span class="spacer"></span><button class="btn ghost" data-x>취소</button>` +
      `<button class="btn pri" id="pay">${won(item.price)} 결제하기</button></div>`
  );
  $("#pay", ov).onclick = () => {
    const b = $("#pay", ov);
    b.disabled = true;
    b.textContent = "결제 승인 중…";
    setTimeout(() => {
      if (item.id === "plus") {
        const base = isPro() ? S.wallet.pro.until : Date.now();
        S.wallet.pro = { until: base + 30 * 86400000 };
        S.wallet.hearts += PLUS_MONTHLY;
        ledger(PLUS_MONTHLY, "PLUS 월간 하트");
      } else {
        S.wallet.hearts += item.hearts;
        ledger(item.hearts, item.name + " 충전");
      }
      S.wallet.history.unshift({ at: Date.now(), name: item.name, price: item.price });
      S.wallet.history = S.wallet.history.slice(0, 50);
      saveWallet();
      $(".sheet", ov).innerHTML =
        `<div class="ok-mark">♥</div><h2 style="text-align:center">결제 완료</h2>
        <p class="sub" style="text-align:center">` +
        `${item.id === "plus" ? `HEART SYNC+가 시작됐어요. 라이트 무제한, 하트 ${PLUS_MONTHLY}개가 지급됐어요.` : `하트 ${num(item.hearts)}개가 지급됐어요. 지금 ♥ ${num(S.wallet.hearts)}`}</p>
        <button class="btn pri block" id="done">${after ? "대화로 돌아가기" : "확인"}</button>`;
      $("#done", ov).onclick = () => {
        ov.remove();
        if (after) after();
        else route();
      };
    }, 1000);
  };
}

/* 공지 화면(#notice)과 고객센터 화면(#help — 자주 묻는 질문·문의하기). 공지는 홈·대화처럼 메뉴에서 바로 들어오고, 고객센터는 MY의 칸에서 들어옴(#help-faq·#help-ask로 바로, 예전 주소 #help-notice는 #notice로 넘김).
   공지·문의는 Supabase(services/support.js), FAQ는 ui/faq.js의 고정 글. 관리자 빌드는 그린 뒤 EXT.help(tab, box, list)로 공지 쓰기·받은 문의를 더함(admin/support.js) — 관리자 계정이면 누를 것 없이 바로 관리
   화면.
   서버 설정이 없으면(SB.on() 거짓) 공지는 마지막으로 받은 것만, 문의는 이메일 안내만 */










/** @typedef {import("../core/types.js").Notice} Notice */
/** @typedef {import("../core/types.js").Inquiry} Inquiry */

const TABS = [
  ["faq", "자주 묻는 질문"],
  ["ask", "문의하기"]
];
const SITE = "https://20232497.github.io/HEARTSYNC/";
const SEEN = "hv1_notice_seen"; // 마지막으로 본 공지 id(가장 큰 것) — MY의 '새 공지' 표시
/** 정적 문서(terms.html·privacy.html) 주소 — 파일로 열었으면 같은 폴더에 문서가 없을 수 있으니 웹 주소로. @param {string} f @returns {string} */
function docUrl(f) {
  return location.protocol === "file:" ? SITE + f : f;
}
const day = (t) => {
  const d = new Date(t);
  return isNaN(d) ? "" : d.toLocaleDateString("ko-KR");
};
// 공지·답변 본문: esc 뒤 주소만 링크로(따옴표·꺾쇠는 이미 이스케이프돼 속성을 깨지 못함)
const rich = (s) => esc(s).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const seenId = () => {
  try {
    return +localStorage.getItem(SEEN) || 0;
  } catch {
    return 0;
  }
};
/** 이 기기에서 아직 안 본 공지가 있는지(마지막으로 받은 목록 기준). @returns {boolean} */
function hasNewNotice() {
  const s = seenId();
  return SUPPORT.cached().some((n) => +n.id > s);
}
let checkedAt = 0;
/** MY를 열 때 공지를 가끔(이 페이지에서 30분에 한 번) 받아 '새 공지'(#noticeNew)를 맞춤 — 실패는 조용히 넘김. @returns {void} */
function checkNotices() {
  if (!SB.on() || Date.now() - checkedAt < 1800000) return;
  checkedAt = Date.now();
  SUPPORT.notices()
    .then(() => {
      const el = $("#noticeNew");
      if (el) el.textContent = hasNewNotice() ? "새 공지" : "";
    })
    .catch(() => {});
}

function viewHelp(arg) {
  if (arg === "notice") {
    location.replace("#notice");
    return;
  } // 예전 주소
  const tab = TABS.some((t) => t[0] === arg) ? arg : "faq",
    v = $("#view");
  v.innerHTML = `<div class="page help-page">${topbar()}
    <div class="help-head"><button class="icon-btn" data-go="me" aria-label="MY로 돌아가기">${ICON.back}</button><h1 class="sec">고객센터</h1></div>
    <div class="tabs" role="tablist">${TABS.map(
      ([k, l]) => `<button type="button" role="tab" data-htab="${k}" aria-selected="` + `${k === tab}" class="${k === tab ? "on" : ""}">${l}</button>`
    ).join("")}</div>
    <div id="helpBody"></div></div>`;
  bindGo(v);
  $$("[data-htab]", v).forEach((b) => (b.onclick = () => go("help-" + b.dataset.htab)));
  const box = $("#helpBody", v);
  if (tab === "ask") askTab(box);
  else faqTab(box);
}

/* ---------------------------------------------------------------- 공지(메뉴 화면) */
function viewNotice() {
  const v = $("#view");
  v.innerHTML = `<div class="page help-page">${topbar()}<h1 class="sec" style="margin-top:4px">공지</h1><div id="helpBody"></div></div>`;
  bindGo(v);
  noticeBody($("#helpBody", v));
}
/** 공지 한 개(접힘). @param {Notice} n @param {boolean} open @returns {string} */
function noticeHTML(n, open) {
  return (
    `<details class="notice" data-nid="${+n.id}" ${open ? "open" : ""}><summary>` +
    `<span class="t">${n.pinned ? `<span class="pill">고정</span>` : ""}${n.published === false ? `<span class="pill gold">비공개</span>` : ""}` +
    `<b>${esc(n.title)}</b></span><span class="d">${day(n.created_at)}</span></summary>
    <div class="nbody">${rich(n.body)}</div></details>`
  );
}
async function noticeBody(box) {
  const seen = seenId();
  const paint = (list, msg) => {
    box.innerHTML =
      (msg ? `<p class="note help-msg">${esc(msg)}</p>` : "") +
      (list.length
        ? `<div class="nlist">${list.map((n, i) => noticeHTML(n, (i === 0 && +n.id > seen) || (n.pinned && +n.id > seen))).join("")}</div>`
        : `<div class="empty">아직 공지가 없어요.</div>`);
    const top = list.reduce((a, n) => Math.max(a, +n.id || 0), 0);
    if (top > seen) {
      try {
        localStorage.setItem(SEEN, String(top));
      } catch {}
    }
    runExt("help", "notice", box, list);
  };
  const cached = SUPPORT.cached();
  if (!SB.on()) return paint(cached, `공지사항은 웹 주소(${SITE.replace("https://", "")})에서 최신으로 볼 수 있어요.`);
  box.innerHTML = cached.length ? "" : `<p class="note">불러오는 중…</p>`;
  if (cached.length) paint(cached);
  try {
    paint(await SUPPORT.notices());
  } catch (e) {
    paint(cached, supportErr(e) + (cached.length ? " 마지막으로 받은 공지를 보여 드려요." : ""));
  }
}

/* ---------------------------------------------------------------- 자주 묻는 질문(찾기 + 묶음별 접기) */
function faqTab(box) {
  box.innerHTML =
    `<div class="field faq-find"><label for="faqQ" class="sr">질문 찾기</label>` +
    `<input id="faqQ" type="search" placeholder="궁금한 것을 찾아보세요 (예: 하트, 비밀번호, 성인)" autocomplete="off"></div>
    <div id="faqList">${faqGroups()
      .map(
        ([g, items]) =>
          `<section class="faq-grp"><h3>${esc(g)}</h3>${items
            .map(([q, a]) => `<details class="faq"><summary>${esc(q)}</summary>` + `<div class="a">${a}</div></details>`)
            .join("")}</section>`
      )
      .join("")}</div>
    <p class="empty" id="faqNone" hidden>찾는 질문이 없어요. <a href="#help-ask">문의하기</a>로 물어봐 주세요.</p>
    <p class="note" style="margin-top:14px">찾는 답이 없으면 <a href="#help-ask">문의하기</a>로 알려 주세요.</p>`;
  const q = $("#faqQ", box);
  q.oninput = () => {
    const t = q.value.trim().toLowerCase();
    let any = false;
    $$(".faq-grp", box).forEach((g) => {
      let hit = 0;
      $$("details", g).forEach((d) => {
        const ok = !t || d.textContent.toLowerCase().indexOf(t) >= 0;
        d.hidden = !ok;
        d.open = !!t && ok;
        if (ok) hit++;
      });
      g.hidden = !hit;
      if (hit) any = true;
    });
    $("#faqNone", box).hidden = any;
  };
}

/* ---------------------------------------------------------------- 문의하기(로그인한 사람만 — 본인 문의만 보임, RLS) */
/** 내 문의 한 개. @param {Inquiry} a @returns {string} */
function askHTML(a, extra = "") {
  const cat = (ASK_CATS.find((c) => c[0] === a.category) || ["", "기타"])[1];
  return (
    `<details class="ask" data-aid="${+a.id}"><summary><span class="t">` +
    (`<span class="pill ${a.status === "open" ? "" : "ok"}">${ASK_STATUS[a.status] || esc(a.status)}</span>` +
      `${urgentReport(a) ? '<span class="pill err">우선 신고</span>' : isReport(a) ? '<span class="pill gold">신고</span>' : ""}`) +
    `<b>${esc(a.title)}</b></span><span class="d">${esc(cat)} · ${day(a.created_at)}</span></summary>
    <div class="nbody">${rich(a.body)}</div>
    ${a.answer ? `<div class="answer"><b>운영자 답변</b><span class="d">${day(a.answered_at)}</span><div>${rich(a.answer)}</div></div>` : ""}${extra}</details>`
  );
}
function askTab(box) {

      `<a href="${SITE}" target="_blank" rel="noopener">${SITE.replace("https://", "")}</a>)에서 로그인한 뒤 문의해 주세요.</p></div>`;

  if (!SB.s) {
    box.innerHTML =

      `<button class="btn pri" data-go="login">로그인 · 회원가입</button></div>
      <p class="note" style="margin:12px 0 0">로그인하지 않고 문의하려면 ${mail}로 메일을 보내 주세요.</p></div>`;
    bindGo(box);

  }
  box.innerHTML =
    `<form class="box ask-form" id="askForm" novalidate>
      <p class="note" style="margin:0 0 4px"><b>${esc(acctName())}</b> 계정으로 남겨요. 답변은 아래 '내 문의'에서 확인할 수 있어요.</p>
      <div class="two"><div class="field"><label for="aCat">분류</label>` +
    `<select id="aCat">${ASK_CATS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
        <div class="field"><label for="aMail">답변 받을 이메일 <span class="note">선택</span></label>` +
    `<input id="aMail" type="email" inputmode="email" autocomplete="email" maxlength="120" placeholder="이메일로도 답을 받으려면"></div></div>
      <div class="field"><label for="aTitle">제목</label><input id="aTitle" maxlength="100" autocomplete="off"></div>
      <div class="field"><label for="aBody" style="display:flex">내용<span class="spacer"></span>` +
    `<output id="aCnt" class="note">0 / 4000</output></label>` +
    `<textarea id="aBody" maxlength="4000" style="min-height:150px" placeholder="무엇을 하다가 어떤 일이 있었는지 적어 주시면 빨리 도와드릴 수 있어요. 비밀번호·API 키는 적지 마세요."></textarea></div>
      <div class="toggle"><label for="aMeta">앱·브라우저 정보 함께 보내기 ` +
    `<span class="note">브라우저 종류·화면 크기·AI 연결 방식(오류 원인을 찾는 데 써요)</span></label><input type="checkbox" id="aMeta"></div>
      <p class="lerr" id="aErr" role="alert"></p>

    `<a href="${docUrl("privacy.html")}#items" target="_blank" rel="noopener">개인정보처리방침</a></span><span class="spacer"></span>` +
    `<button class="btn pri" type="submit" id="aSend">보내기</button></div>
    </form>
    <h2 class="sec">내 문의 <small>하루 ${ASK_DAILY}건까지</small></h2><div id="askList"><p class="note">불러오는 중…</p></div>`;
  const err = $("#aErr", box),
    body = $("#aBody", box);
  // 선택 수집 항목이라 미리 켜 두지 않음 — 오류 신고를 고르면 켜 보라고 한 줄 안내
  $("#aCat", box).onchange = (e) => {
    if (e.target.value === "bug" && !$("#aMeta", box).checked) err.textContent = "오류 신고는 '앱·브라우저 정보 함께 보내기'를 켜 주시면 원인을 찾기 쉬워요.";
    else if (err.textContent.indexOf("앱·브라우저") >= 0) err.textContent = "";

    const btn = $("#aSend", box);

let wiping = false,

async function wipeAll() {
  if (wiping) return; // 확인 창을 두 번 눌러도 한 번만 — 둘째가 '계정은 끝났다'고 보고 기기부터 지우지 않게
  wiping = true;

    await wipeNow();
  } finally {
    wiping = false;
  }
}
async function wipeNow() {
  toast("지우는 중이에요…");
  const uid = CLOUD.uid,
    got = CLOUD.on && !accountWiped ? await wipeAccount() : "ok";
  if (got !== "ok") {
    // 계정 쪽이 실패하면 이 기기에 그대로 있는 것을 다시 올려 둠 — 대화는 어느 쪽에서도 지워지지 않았음. "half"(방이 아닌 행만 지워짐)는 방의 표식 요청이 서버에
    // 적용됐을 수 있어 방 본문까지. "unsure"(첫 DELETE의 답을 잃음 — 2026-11-25 디렉터 검토: 전에는 목록·지갑·페르소나가 빠진 계정이 남았음)는 방 행을 건드리기
    // 전이라 방이 아닌 행만(다른 기기가 올린 더 새 방 본문을 옛 본문으로 덮지 않게). "fail"(서버가 거절 — 지워진 것 없음)은 올리지 않음(Codex 검토)
    if (got !== "fail" && CLOUD.on && CLOUD.uid === uid)
      try {
        await pushAll(got === "unsure" ? localKVKeys().filter((k) => !/^room-/.test(k)) : undefined);
      } catch {}
    return wipeFailed("계정의 데이터를 지우지 못했어요", "네트워크를 확인하고 다시 시도해 주세요. 이 기기의 데이터도 아직 그대로예요.");
  }
  // 지우는 사이 계정이 바뀌었으면(로그아웃·다른 계정) 이 기기에 있는 것은 이제 다른 계정의 것 — 지우지 않음
  if (CLOUD.uid !== uid) return toast("계정이 바뀌어서 이 기기의 데이터는 지우지 않았어요");
  accountWiped = true;
  const clean = await clearDevice(); // 큰 저장소(방 본문·그림)를 비웠는지
  if (!clean) return wipeFailed("이 기기의 데이터를 다 지우지 못했어요", "이 사이트를 연 다른 탭을 닫고 다시 시도해 주세요.", true);
  location.reload();
}
function wipeFailed(title, sub, half) {
  const ov = sheet(
    `<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p><div class="cta-row"><span class="spacer"></span>` +
      `<button class="btn ghost" data-x>닫기</button><button class="btn pri" id="wRetry">다시 시도</button></div>`
  );
  let again = false;
  $("#wRetry", ov).onclick = () => {
    again = true;
    ov.remove();
    wipeAll();
  };
  // 계정은 지워졌고 이 기기만 덜 지워진 채 닫으면 새로고침 — 이 화면은 계정에 더 올리지 않는 상태(CLOUD.wiped)라 그대로 쓰게 두지 않음(새로고침하면 풀림)
  if (half)
    ov.onShut = () => {
      if (!again) location.reload();
    };
}

      room.persona = { id: item.id, name: item.name, memo: item.memo, desc: item.desc, img: item.img };

      renderLog();
    }
    ov.remove();
    after && after();

    del.onclick = () => {

const KB_MIN = 100; // 이만큼 넘게 가려져야 자판으로 봄(주소창이 접히고 펴지는 정도는 무시)
let kbChat = null,
  kbBound = null; // 맞추는 대화방 요소 · 리스너를 단 visualViewport
/** 대화방 요소를 자판 위에 맞추기 시작 — 같은 방을 다시 그려도 새 요소로 바꿔 끼움. @param {HTMLElement|null} chat */
function fitKeyboard(chat) {

  if (kbBound !== vv) {

    kbChat = chat;
    kbBound = vv;

    vv.addEventListener("scroll", kbFit);

function kbFit() {

    c = kbChat;
  if (!vv || !c || !c.isConnected) return kbStop();

  c.style.position = "fixed";
  c.style.top = vv.offsetTop + "px";
  c.style.left = box.left + "px";
  c.style.width = box.width + "px";
  c.style.height = vv.height + "px";

  prev.forEach((m) => imgTags(curText(m)).forEach((t) => seen.add(baseOf(t.code))));

    const n = x.name.trim(),
      k = [n],

    if (/^[가-힣]{3,4}$/.test(n)) k.push(n.slice(1));

    anyNamed = cast.some((x) => keysOf(x).some((k) => said2.includes(k)));

    const speaks = (l) => keys.some((k) => new RegExp("^\\s*" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*:").test(l));

      at = Math.max(
        0,

    if (have.has(f.x.code)) return;
    let sit = 1;
    if (!seen.has(f.x.code)) sit = 0;

    .slice(0, 5)

    return `<div class="ep-card ep-end" role="region" aria-label="결말">
      <span class="ep-k">결말</span><b class="ep-title">${esc(end.title)}</b>
      <span class="note">${st.t}턴${path.length ? " · 고른 길: " + path.map(esc).join(" → ") : ""}</span>
      ${endsHTML(ep, got)}
      <span class="note ep-count">본 결말 ${n}개 — 다른 길을 고르면 다른 결말에 닿아요</span>
      <div class="cta-row"><button class="btn pri" id="epSide">외전 이어 가기</button><button class="btn" id="epAgain">처음부터 다시</button></div>
    </div>`;
  }
  const ch = st.ask && choiceOf(ep, st.ask);
  if (!ch || r.lastErr) return "";
  return `<div class="ep-card ep-choice" role="group" aria-label="갈림길"><span class="ep-k">갈림길</span><b class="ep-title">${esc(ch.ask)}</b>

/** 결말 이름 칩 — 모두 보이고, 본 결말은 ✓와 강조(상세 페이지의 안내 칸도 같이 씀). @param {import("../../core/types.js").Episode} ep @param {Set<string>} got */

  );

/** 갈림길 카드(누르면 그 보기를 유저의 말로 보냄 — 턴당 하트는 평소와 같음)·결말 카드 버튼. @param {HTMLElement} box @param {Room} r */
function bindEp(box, r) {
  $$("[data-pick]", box).forEach(
    (b) =>
      (b.onclick = () => {
        if (gen) return flashHint("응답이 끝난 뒤에 고를 수 있어요.");
        const ch = r.ep && choiceOf(r.char.episode, r.ep.ask),
          o = ch && ch.options.find((x) => x.id === b.dataset.pick);
        if (o) sendTurn(o.label, { pick: o.id });
      })
  );

/**

 * 고르면 이 대화와 결말을 이어받은 새 자유 대화방(core/rooms.js sideRoom)으로 감 — 작품당 방 수 한도는 분기와 같음. @param {Room} r

function sideSheet(r) {
  if (S.rooms.filter((x) => x.charId === r.char.id).length >= plan().rooms) return plusSheet("rooms");
  const cast = (r.char.cast || []).filter((x) => !x.of);
  let kind = Object.keys(SIDE)[0],
    who = cast[0] ? cast[0].code : "";
  const sh = sheet(
    `<h2>외전 이어 가기</h2><p class="sub">이 대화와 결말을 그대로 이어받은 새 대화방을 만들어요. 인물과 못다 한 이야기를 나누거나, 같은 사건을 다른 인물의 눈으로 다시 볼 수 있어요. 끝이 정해지지 않은 ` +
      `자유 대화이고 요금은 지금처럼 턴당 하트, 지금 방은 그대로 남아요.</p>
    <div class="side-kinds" role="radiogroup" aria-label="외전 갈래">${Object.keys(SIDE)
      .map(
        (k) =>
          `<button class="side-kind" role="radio" data-k="${k}" aria-checked="${k === kind}"><b>${esc(SIDE[k].label)}</b>` +
          `<span>${esc(SIDE[k].desc)}</span></button>`
      )
      .join("")}</div>
    <div class="field" id="sideWho" hidden><label>누구의 이야기로 할까요?</label>` +
      `<div class="side-who" role="radiogroup" aria-label="인물">${cast
        .map((x) => `<button class="chip" role="radio" data-who="` + `${esc(x.code)}" aria-checked="${x.code === who}">${esc(x.name)}</button>`)
        .join("")}</div></div>
    <div class="cta-row"><button class="btn ghost" data-x>취소</button><span class="spacer"></span><button class="btn pri" id="sideGo">외전 시작</button></div>`
  );
  const paint = () => {
    $$("[data-k]", sh).forEach((b) => b.setAttribute("aria-checked", String(b.dataset.k === kind)));
    $$("[data-who]", sh).forEach((b) => b.setAttribute("aria-checked", String(b.dataset.who === who)));
    $("#sideWho", sh).hidden = !SIDE[kind].who;
  };
  $$("[data-k]", sh).forEach(
    (b) =>
      (b.onclick = () => {
        kind = b.dataset.k;
        paint();
      })
  );
  $$("[data-who]", sh).forEach(
    (b) =>
      (b.onclick = () => {
        who = b.dataset.who;
        paint();
      })
  );
  paint(); // 기본 갈래(첫째)가 인물을 고르는 갈래면 인물 칸을 처음부터 보여 줌
  $("#sideGo", sh).onclick = () => {
    const f = sideRoom(r, kind, SIDE[kind].who ? who : "");
    if (!f) return toast("외전을 만들지 못했어요");
    closeOverlays();
    setRoom(f);
    go("r-" + f.id);
    toast("외전을 열었어요 — ✦ 추천에 첫 장면 제안이 있어요");
  };
}

/** @typedef {import("../core/types.js").Room} Room */

/** 신고에 담을 메시지 앞부분 — 그림 태그를 빼고 공백을 줄여 LIMITS.reportQuote자까지. @param {string} text @returns {string} */

/**

    <div class="rp-why" id="rpWhy" role="group" aria-label="신고 사유">` +

    <div class="field" style="margin-top:12px"><label for="rpNote">덧붙일 말 <span class="note">선택</span></label>` +
      `<textarea id="rpNote" maxlength="500" style="min-height:70px" placeholder="어떤 점이 문제였는지 적어 주시면 확인이 빨라요."></textarea></div>
    <div class="toggle" style="margin-top:12px"><label for="rpQuote">이 메시지 앞부분(${LIMITS.reportQuote}자)을 함께 보내기 ` +

    <div class="cta-row" style="margin-top:6px"><span class="note">신고 내용은 문의와 같이 보관해요 · ` +
      `<a href="${docUrl("privacy.html")}#items" target="_blank" rel="noopener">개인정보처리방침</a></span><span class="spacer"></span>` +
      `<button class="btn pri" id="rpSend">신고 보내기</button></div>`
  );
  let why = ""; // 사유는 미리 골라 두지 않음 — 급한 사유가 실수로 접수되지 않게
  $$("[data-why]", ov).forEach(
    (b) =>
      (b.onclick = () => {

  $("#rpSend", ov).onclick = async (e) => {

      err = $("#rpErr", ov),

      $("#rpQuote", ov).checked && quote ? "\n[신고한 메시지 앞부분]\n" + quote : ""

}

/* 말풍선 메뉴 처리 — 버전 넘기기·다시 쓰기·복사·북마크·고정·신고·좋아요/아쉬워요·분기·수정·삭제, 상태창 펼치기·그림 크게 보기·다시 시도. 메시지 로그(ui/chat/log.js renderLog)가 그린 뒤 붙임 */
















function bindLog(box) {
  $$(".status .inner:not(.open)", box).forEach((el) => {
    const open = () => el.classList.add("open");
    el.onclick = open;
    el.onkeydown = (e) => {
      if (e.key === "Enter") open();
    };
  });
  $$(".scene-img", box).forEach((f) => {
    if (f.querySelector("img"))
      f.onclick = (e) => {
        if (e.target.closest("img, video")) zoomPic(f);
      };
  });
  const retry = $("#retry");
  if (retry)
    retry.onclick = async () => {
      room.lastErr = "";
      const i = room.msgs.length - 1;
      if (room.msgs[i]?.role === "ai") return regen(i);
      const u = room.msgs.pop();
      renderLog();
      if (u) {
        const ok = await sendTurn(u.sys ? "" : u.text, { cont: !!u.sys });
        if (!ok) {
          room.msgs.push(u);
          renderLog();
        }
      }
    };
  $$("[data-act]", box).forEach(
    (b) =>
      (b.onclick = () => {
        const i = +b.dataset.i,
          m = room.msgs[i],
          act = b.dataset.act;
        if (gen && !["copy", "bm", "up", "down", "pin"].includes(act)) return flashHint("응답이 끝난 뒤에 할 수 있어요.");
        if (act === "prev" || act === "next") {
          m.idx = clamp(m.idx + (act === "next" ? 1 : -1), 0, m.alts.length - 1);
          restoreStatus();
          if (room.ep && i === room.msgs.length - 1 && (m.alts[m.idx].ep1 || m.ep0)) room.ep = epCopy(m.alts[m.idx].ep1 || m.ep0); // 에피소드: 그 버전 뒤의 진행 상태로
          saveRoom(room);
          renderLog();
          syncSug();
        } else if (act === "regen") regenAsk(i);
        else if (act === "copy") copyText(curText(m).replace(/\[\[img:[^\]]*\]\]\n?/g, ""), "복사했어요");
        else if (act === "bm") {
          const s = new Set(room.bookmarks || []);
          s.has(m.id) ? s.delete(m.id) : s.add(m.id);
          room.bookmarks = [...s];
          saveRoom(room);
          renderLog();
          toast(s.has(m.id) ? "북마크에 담았어요" : "북마크에서 뺐어요");
        } else if (act === "pin") pinSheet(room, m);
        else if (act === "report") reportSheet(room, m);
        else if (act === "up" || act === "down") {
          const a = m.alts[m.idx],
            v = act === "up" ? 1 : -1;
          a.fb = a.fb === v ? 0 : v;
          saveRoom(room);
          renderLog();
        } else if (act === "fork") {
          if (S.rooms.filter((x) => x.charId === room.char.id).length >= plan().rooms) return plusSheet("rooms");
          confirmSheet("이 장면에서 분기할까요?", "이 메시지까지를 복사한 새 대화방을 만들어요. 지금 대화방은 그대로 남아요.", "분기", () => {
            const f = forkRoom(room, m.id);
            if (f) {
              setRoom(f);
              go("r-" + f.id);
              toast("분기한 대화방이에요");
            }
          });
        } else if (act === "edit" || act === "editai") {
          m.editing = true;
          drafts.delete(m.id);
          renderLog();
          $("#ed" + i)?.focus();
        } else if (act === "cancel") {
          delete m.editing;
          drafts.delete(m.id);
          renderLog();
        } else if (act === "save") {
          const t = $("#ed" + i).value.trim();
          if (!t || m.role !== "user") delete m.editing;
          if (!t) return renderLog();
          if (m.role === "user") {
            // 값 확인이 끝난 뒤에만 고침 — 그 창을 닫거나 하트가 모자라면 대화는 그대로, 고쳐 쓴 글은 수정 칸에 그대로 남김(쓰던 글 그대로 — 하트를 사고 와서 다시 누르게)
            const r = room;
            drafts.set(m.id, t);
            ensurePay(r).then((q) => {
              if (!q || r !== room) return renderLog();
              delete m.editing;
              drafts.delete(m.id);
              // 새 답이 본문 하나 없이 실패하면 되돌릴 것: 원문·뒤 메시지·상태창·에피소드 진행(generate가 undo를 부름).
              // 자른 대화는 여기서 저장하지 않음 — 응답이 끝날 때 한 번(그 전에 창이 닫히면 저장된 것은 고치기 전 대화)
              const was = { text: m.text, msgs: r.msgs, status: r.status, ep: r.ep ? epCopy(r.ep) : null, err: r.lastErr },
                gone = r.msgs[i + 1];
              m.text = t;
              r.lastErr = "";
              r.msgs = r.msgs.slice(0, i + 1);
              restoreStatus();
              if (r.ep && gone && gone.ep0) r.ep = epCopy(gone.ep0);
              const undo = () => {
                m.text = was.text;
                r.msgs = was.msgs;
                r.status = was.status;
                r.lastErr = was.err;
                if (was.ep) r.ep = was.ep;
                return "고치기 전 대화로 되돌렸어요.";
              };
              generate(null, q, "", { edit: true, undo });
            });
          } else {
            m.alts[m.idx].text = t;
            saveRoom(room);
            renderLog();
          }
        } else if (act === "del")
          confirmSheet("이 메시지부터 끝까지 지울까요?", "지운 메시지는 되돌릴 수 없어요. 상태창도 그 시점으로 돌아가요.", "삭제", () => {
            const first = room.msgs.slice(Math.max(1, i)).find((x) => x.ep0);
            if (room.ep && first) room.ep = epCopy(first.ep0); // 에피소드: 지운 것 가운데 진행 상태를 적은 첫 메시지 직전으로(즉답 메시지는 상태를 바꾸지 않아 ep0가 없음 — 결말 뒤를 지우면 다시 이어 쓸 수 있음)
            room.msgs = room.msgs.slice(0, Math.max(1, i));
            room.lastErr = "";
            restoreStatus();
            saveRoom(room);
            renderLog();
            updateMeter();
            syncSug();
          });
      })
  );
}
/* 마지막 답변(또는 그 버전)이 바뀐 뒤: 펼쳐 둔 추천은 예전 답변의 것이니 닫고, 추천 버튼의 값 표시를 지금 답변에 맞춤 —
   저장된 추천이 없는 버전으로 바꿨는데 값 없는 버튼이 남으면 누를 때 보이지 않던 값이 나감 */
function syncSug() {
  hideSug();
  updateComposer();
}
function restoreStatus() {
  const a = lastAi(room);
  room.status = a ? a.alts[a.idx].status || a.statusBefore : room.status;
  updateMeter();
}

function resumeHTML(rooms) {

function descHTML(c) {

function openingHTML(c, o, i, persona) {
  return (
    `<div class="opening"><b>${esc(o.title)}${opPlace(c, o)}</b><span class="brief">${esc(opBrief(o))}…</span>` +
    `<details class="d-scene"><summary>장면 펼쳐 읽기</summary><div class="bubble">${fmt(o.text.replace(/\[\[[^\]]*\]\]/g, ""), c, persona)}</div></details>` +
    `<button type="button" class="btn sm" data-op="${i}">이 상황으로 시작</button></div>`
  );

/* 접는 칸으로 바꿈: .box(div) → details.box(머리 h3가 summary) — 긴 칸(명령어·장소·컷씬·세계관 일러스트·긴 플레이 가이드)이 처음에는 접혀 있게 */
function foldBox(box, open) {
  const h = box.querySelector("h3");
  if (!h) return;
  const d = document.createElement("details"),
    s = document.createElement("summary");
  d.className = box.className;
  d.open = !!open;
  if (box.id) d.id = box.id;
  if (box.style.display) d.style.display = box.style.display;
  s.append(h);
  d.append(s, ...Array.from(box.childNodes));
  box.replaceWith(d);
}
/* 탭 줄: 누르면 그 칸이 탭 줄 바로 아래에 오게 옮기고, 스크롤하는 동안 지금 칸을 강조. 화면이 바뀌어 탭 줄이 사라지면 스크롤 듣기를 스스로 뗌 */
function bindTabs(v) {
  const tabs = $("#dTabs", v),
    btns = $$("[data-tab]", tabs),
    secs = btns.map((b) => $("#d-" + b.dataset.tab, v));
  const mark = () => {
    if (!document.body.contains(tabs)) return v.removeEventListener("scroll", mark);
    const line = tabs.getBoundingClientRect().bottom + 16;
    let cur = 0;
    secs.forEach((s, i) => {
      if (s.getBoundingClientRect().top <= line) cur = i;
    });
    btns.forEach((b, i) => {
      b.classList.toggle("on", i === cur);
      if (i === cur) b.setAttribute("aria-current", "true");
      else b.removeAttribute("aria-current");
    });
  };
  btns.forEach(
    (b, i) =>
      (b.onclick = () => {
        v.scrollTop += secs[i].getBoundingClientRect().top - v.getBoundingClientRect().top - tabs.offsetHeight - 8;
      })
  );
  v.addEventListener("scroll", mark, { passive: true });
  mark();
}
/** 에피소드형 작품의 안내 칸 — 장 수·결말 수·대략의 턴 수와 결말 이름(모두 보이고 본 것에 ✓). 자유형이면 "". @param {Work} c */
function epInfoHTML(c) {
  const ep = c.episode;

  const got = endsSet(c.id),
    n = ep.endings.filter((x) => got.has(x.id)).length;

    <p>${ep.beats.length}장 · 결말 ${ep.endings.length}개 · 약 ${epLength(ep)}턴 — 고른 길과 행동에 따라 결말이 갈려요. 결말을 본 뒤에는 그 대화를 이어받아 외전 — 인물과 더 ` +
    `나누는 이야기, 다른 인물의 눈으로 다시 보는 사건 — 으로 이어 갈 수 있어요. 요금은 자유 대화와 같은 턴당 하트예요.</p>
    ${endsHTML(ep, got)}
    <span class="note">본 결말 ${n}개</span></div>`
  );
}

/* ---------------------------------------------------------------- 로그인 뒤 돌아갈 곳(작품·공지)
   처음 방문한 사람이 작품 주소(#c-<id>)나 공지(#notice)로 들어오면 부팅이 주소를 #login-c-<id>·#login-notice로 바꾼다 — 주소가 갈 곳을 들고 있어 새로 고침해도 남고, 메뉴로 나가면 저절로 사라진다.
   소셜 로그인·인증 메일은 redirect_to에 주소를 실을 수 없어 사이트 첫 화면으로 돌아오므로, 떠나기 전에 hv1_back에 적어 둔다.
   인증 메일은 새 탭으로 열리니 sessionStorage가 아니라 localStorage, 메일 링크가 유효한 1시간만 */
const BACK_KEY = "hv1_back",
  BACK_MS = 3600000;
const backHash = (h) => (/^c-./.test(h) || h === "notice" ? h : ""); // 돌아갈 수 있는 곳은 작품 주소와 공지뿐
const canBack = (h) => h === "notice" || !!getChar(h.slice(2));
const loginBack = () => {
  const h = location.hash.slice(1);
  return h.startsWith("login-") ? backHash(h.slice(6)) : "";
};
const setHash = (h) => {
  try {
    history.replaceState(null, "", location.pathname + location.search + "#" + h);
  } catch {}
};
function saveBack() {
  const to = loginBack();
  if (to) {
    try {
      localStorage.setItem(BACK_KEY, JSON.stringify({ to, at: Date.now() }));
    } catch {}
  }
}
function takeBack() {
  try {
    const v = localStorage.getItem(BACK_KEY);
    localStorage.removeItem(BACK_KEY);
    const b = JSON.parse(v);
    return b && Date.now() - b.at < BACK_MS ? backHash(b.to) : "";
  } catch {
    return "";
  }
}
/* 부팅 때 첫 주소를 정함. 작품은 모두 content/에서 오므로(계정에만 있는 작품 없음) 지금 못 찾으면 홈 */
function bootBack(askLogin) {
  const h = location.hash.slice(1),
    saved = takeBack(),
    to = !h ? saved : loginBack() || (askLogin ? backHash(h) : "");
  if (askLogin) {
    setHash(to ? "login-" + to : "login");
    return;
  }
  if (to) setHash(canBack(to) ? to : "home");
}
/* 로그인·둘러보기를 마치고 나감: 돌아갈 곳이 있으면 그리로(로그인 화면은 방문 기록에서 빠짐), 없는 작품이면 홈 */
function leaveLogin() {
  const to = loginBack();
  takeBack();
  $("#view").scrollTop = 0;
  window.scrollTo(0, 0); // 폼을 내려 누른 자리가 다음 화면에 이어지면 작품 제목이 잘림
  if (to && canBack(to)) location.replace("#" + to);
  else go("home");
}

/* 관리자 페이지 비밀번호 관문(관리자 빌드만): 웹 주소(https://…/admin.html)로 열면 비밀번호를 맞혀야 부팅한다. 로컬(localhost·127.0.0.1·file://)은 묻지 않음(개발 서버·흐름 시험·로컬 파일).
   비밀번호는 소스에 SHA-256 해시로만 두고 입력값의 해시와 비교(crypto.subtle — https·localhost·file 모두 보안 컨텍스트). 맞으면 이 브라우저에 기억(localStorage hv1_admin = 해시), MY의 '관리자 잠그기'가 지움.
   주의: 정적 페이지의 클라이언트 관문이라 소스를 읽는 사람은 우회할 수 있다 — 무심코 들어오는 것을 막는 용도. 실제 데이터(API 키·그림·대화)는 관리자의 브라우저와 계정(Supabase RLS)에만 있어 페이지가 보여도 새지 않는다.
   비밀번호를 바꾸려면 HASH를 새 비밀번호의 sha256 16진수로(node -e 'console.log(require("crypto").createHash("sha256").update("새비밀번호").digest("hex"))') */




const HASH = "0b66aa75aec80f1efadd5420201f74451496acf05526b52015ee26ea44ed3a3e",
  KEY = "hv1_admin";
/** 관문을 세울 자리인지 — 웹 주소(http/https)이고 로컬 호스트가 아닐 때. @returns {boolean} */
const gateNeeded = () => /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
async function sha256(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
/** 이 브라우저의 기억을 지우고 다시 묻게 함. @returns {void} */
function lockAdmin() {
  try {
    localStorage.removeItem(KEY);
  } catch {}
  location.reload();
}
/* MY(관리자 도구, 웹 주소일 때만): 이 브라우저의 기억을 지우는 버튼 */
EXT.me.push((v) => {
  const box = $("#meExt", v);
  if (!box || !gateNeeded()) return;
  box.insertAdjacentHTML(
    "beforeend",
    `<div class="box" style="margin-top:12px"><button class="btn sm ghost" id="adminLock">이 브라우저에서 관리자 잠그기</button></div>`
  );
  $("#adminLock", box).onclick = () => lockAdmin();
});
/** 비밀번호가 맞을 때(또는 관문이 필요 없을 때) 풀리는 약속 — 진입점이 boot() 앞에 기다림. @returns {Promise<void>} */
function gate() {
  return new Promise((resolve) => {
    let ok = false;
    try {
      ok = localStorage.getItem(KEY) === HASH;
    } catch {}
    if (!gateNeeded() || ok) return resolve();
    const v = $("#view");
    document.body.classList.add("gated");
    v.innerHTML =
      `<div class="page"><div class="login-page"><div class="login-card">${LOGO}<p class="lead">관리자 도구예요. 비밀번호를 넣어 주세요.</p>
      <form id="gateForm"><div class="field" style="margin-top:0"><label for="gatePw">비밀번호</label>` +
      `<input id="gatePw" type="password" autocomplete="current-password"></div>
        <button class="btn pri block" type="submit">들어가기</button><p class="note" id="gateMsg" role="alert"></p></form>
      <p class="note" style="text-align:center">사용자 사이트는 <a href="./">여기</a>예요.</p></div></div></div>`;
    const pw = $("#gatePw", v),
      msg = $("#gateMsg", v);
    pw.focus();
    $("#gateForm", v).onsubmit = async (e) => {
      e.preventDefault();
      if (!(window.crypto && crypto.subtle)) {
        msg.textContent = "이 브라우저에서는 열 수 없어요. 최신 Chrome·Safari로 https 주소에서 열어 주세요.";
        return;
      }
      if ((await sha256(pw.value)) === HASH) {
        try {
          localStorage.setItem(KEY, HASH);
        } catch {}
        document.body.classList.remove("gated");
        v.innerHTML = `<p class="boot-msg" id="bootMsg">불러오는 중…</p>`;
        resolve();
      } else {
        msg.textContent = "비밀번호가 달라요.";
        pw.value = "";
        pw.focus();
      }
    };
  });
}

   src/js/core/migrate.js
   가져옴: src/js/core/settings.js { saveSettings }
           src/js/core/state.js { S }
           src/js/core/util.js { clamp }
   내보냄: migrateSettings

/* 설정 이전(migrateSettings): localStorage의 예전 설정을 지금 모양으로 — 없앤 설정 지우기, 값 범위.
   예전 빌드의 그림·성인 설정 칸(customSits·styleSets·isAgeVerified 등)은 지우지 않고 그대로 둠 — 쓰는 코드가 없어 아무 영향이 없고, 지우면 계정에 있던 값까지 사라짐 */




/** 저장된 설정을 읽어 S.settings에 얹고 정리한다. @returns {void} */
function migrateSettings() {
  let s = null;
  try {
    s = JSON.parse(localStorage.getItem("hv1_settings") || "null");
  } catch {}
  if (s) S.settings = { ...S.settings, ...s, memCfg: { ...S.settings.memCfg, ...(s.memCfg || {}) } };
  let moved = false;
  // 장기기억 설정의 원본은 설정(memCfg 칸) 하나. 설정에 그 칸이 없는 예전 설치에서만 따로 두던 사본(hv1_memcfg)을 읽어 설정으로 옮김 — 사본은 지우지 않고 더 쓰지 않음
  if (!s || !s.memCfg)
    try {
      const old = JSON.parse(localStorage.getItem("hv1_memcfg") || "null");
      if (old && typeof old === "object") {
        S.settings.memCfg = { ...S.settings.memCfg, ...old };
        moved = true;
      }
    } catch {}
  try {
    // 없앤 설정: 등급별 OpenRouter 모델
    for (const k of ["unfilteredModels"])
      if (k in S.settings) {
        delete S.settings[k];
        moved = true;
      }
    // 화면 테마: "light"·"dark"만(고르지 않았으면 칸이 없음 = 기기 설정을 따름). 예전 빌드가 남긴 다른 값은 지움
    if ("theme" in S.settings && S.settings.theme !== "light" && S.settings.theme !== "dark") {
      delete S.settings.theme;
      moved = true;
    }
    S.settings.fs = clamp(+S.settings.fs || 15.5, 13, 21);
    S.settings.chatLh = clamp(+S.settings.chatLh || 1.8, 1.4, 2.4);
  } catch {}
  if (moved) saveSettings();
}

/* 부팅이 던지면 '불러오는 중…'에 머물지 않게 이유를 보여 줌 — 뼈대의 앞쪽 ES5 스크립트는 error 이벤트만 받아, 약속이 거부된 것은 못 봄.
   첫 화면이 이미 그려진 뒤(#bootMsg가 없음)의 실패는 전처럼 전역 처리기(core/util.js)로 */
function bootFail(e) {
  const m = typeof document !== "undefined" ? document.getElementById("bootMsg") : null;
  if (!m) throw e;
  console.error("[HEART SYNC] 부팅 실패", e);
  m.textContent = "화면을 불러오지 못했어요. 새로고침해 주세요. (" + ((e && e.message) || "알 수 없는 오류") + ")";
}
async function boot() {
  migrateSettings();
  applySettings();
  // 계정: 인증 메일·소셜 로그인에서 돌아왔으면(#access_token…) 먼저 세션으로 바꿈
  SB.load();
  const authType = SB.on() ? await SB.fromHash() : "";
  await loadAll();
  renderShell();
  // 처음 시작: 로그인 페이지(계정 서버가 있고, 로그인도 둘러보기도 안 했을 때) → 관심있는 대화 고르기
  const askLogin = SB.on() && !SB.s && !localStorage.getItem("hv1_guest") && !location.hash.startsWith("#r-");
  bootBack(askLogin); // 작품 주소로 처음 들어왔으면 로그인·둘러보기 뒤 그 작품으로
  route();
  window.addEventListener("hashchange", route);
  // 방을 열어 둔 사이 다른 기기가 그 방을 고쳤으면(받기가 덮지 않고 넘어감) 방에서 나올 때 그 방만 다시 받음
  window.addEventListener("hashchange", () => {
    if (CLOUD.on && CLOUD.skipped.size) CLOUD.retake();
  });
  if (SB.s)
    afterLogin(!!authType).then(() => {
      if (authType === "recovery") newPasswordSheet();
      else askAud();
    });
  else if (!askLogin) askAud();
  // 다른 기기에서 바꾼 것: 이 탭으로 돌아올 때 받아 오고, 떠날 때 못 올린 것을 올림
  document.addEventListener("visibilitychange", () => {
    if (!CLOUD.on) return;
    if (document.hidden) CLOUD.flush();
    else if (Date.now() - CLOUD.pulledAt > 20000 && !gen)
      CLOUD.pull()
        .then((n) => {
          if (n) reloadFromCloud();
        })
        .catch(() => {});
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || escapeLayer()) return; // 크게 보기·맨 위 겹을 먼저 닫음(ui/sheet.js — 겹의 키보드는 한 곳에서)
    if (gen && location.hash === "#r-" + gen.roomId) stopGen(); // 그 방을 보고 있을 때만 — 떠난 방의 답은 다른 화면의 Esc로 멈추지 않음
  });
}
