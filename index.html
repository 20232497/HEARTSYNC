<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HEARTVERSE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: 앱 셸 — 데스크톱은 왼쪽 레일 + 본문, 모바일은 하단 탭바. 대화방은 전체 높이 3단(헤더·로그·입력창), 관리 메뉴는 오른쪽 드로어. */
:root {
  --bg:#f6f4f9; --surface:#ffffff; --surface2:#efecf5; --line:#e2dcec; --fg:#1c1827; --muted:#6c6580;
  --narr:#5a536d; --accent:#e23d74; --accent-ink:#ffffff; --accent-soft:rgba(226,61,116,.10); --gold:#b9780f; --ok:#2b8a57; --err:#c92a3a;
  --sys:#5b4fc4; --sys-soft:rgba(91,79,196,.09);
  --scrim:rgba(20,16,30,.45);
  --display:"Hahmlet","Nanum Myeongjo",serif; --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --chat-fs:15.5px; --chat-lh:1.8; --narr-font:var(--serif); --r:14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0f0d15; --surface:#18151f; --surface2:#211d2b; --line:#2e2939; --fg:#eeeaf6; --muted:#9a93ae;
  --narr:#b4acc7; --accent:#ff5b8e; --accent-ink:#1a0b12; --accent-soft:rgba(255,91,142,.14); --gold:#f0b54a; --ok:#53c48a; --err:#ff6b7a;
  --sys:#a99cff; --sys-soft:rgba(169,156,255,.10);
  --scrim:rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0f0d15; --surface:#18151f; --surface2:#211d2b; --line:#2e2939; --fg:#eeeaf6; --muted:#9a93ae;
  --narr:#b4acc7; --accent:#ff5b8e; --accent-ink:#1a0b12; --accent-soft:rgba(255,91,142,.14); --gold:#f0b54a; --ok:#53c48a; --err:#ff6b7a;
  --sys:#a99cff; --sys-soft:rgba(169,156,255,.10);
  --scrim:rgba(0,0,0,.6); color-scheme:dark; }

* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:14.5px; line-height:1.6; overflow:hidden; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.spacer { flex:1; }

/* ── 앱 셸 */
.app { display:grid; grid-template-columns:232px minmax(0,1fr); height:100%; }
.rail { border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; padding:18px 12px; gap:4px; overflow-y:auto; }
.logo { font-family:var(--display); font-weight:800; font-size:21px; letter-spacing:.06em; padding:4px 10px 16px; display:flex; align-items:center; gap:8px; }
.logo i { font-style:normal; color:var(--accent); }
.nav { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:0; background:none; text-align:left; width:100%; color:var(--muted); font-weight:500; }
.nav:hover { background:var(--surface2); color:var(--fg); }
.nav.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.nav svg { width:19px; height:19px; flex:none; }
.rail h4 { margin:18px 12px 6px; font-size:11.5px; letter-spacing:.08em; color:var(--muted); font-weight:600; }
.rail .recent { display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:10px; border:0; background:none; width:100%; text-align:left; }
.rail .recent:hover { background:var(--surface2); }
.rail .recent .cover { width:30px; height:30px; border-radius:9px; flex:none; }
.rail .recent span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
.rail-foot { margin-top:auto; padding-top:14px; }
#view { height:100%; overflow-y:auto; overflow-x:hidden; position:relative; }
.boot-msg { padding:48px 20px; text-align:center; color:var(--muted); font-size:14px; }
.tabbar { display:none; }
@media (max-width:899px) {
  .app { grid-template-columns:1fr; }
  .rail { display:none; }
  #view { height:calc(100% - 60px - env(safe-area-inset-bottom,0px)); }
  .tabbar { display:flex; position:fixed; left:0; right:0; bottom:0; height:calc(60px + env(safe-area-inset-bottom,0px)); padding:0 max(6px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px, env(safe-area-inset-left,0px)); background:var(--surface); border-top:1px solid var(--line); z-index:20; }
  .tabbar button { flex:1; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; color:var(--muted); }
  .tabbar button.on { color:var(--accent); font-weight:600; }
  .tabbar svg { width:21px; height:21px; }
  body.in-chat .tabbar { display:none; }
  body.in-chat #view { height:100%; }
}

.page { max-width:1120px; margin:0 auto; padding-block:20px 48px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.topbar { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.topbar .logo { padding:0; display:none; }
@media (max-width:899px) { .topbar { flex-wrap:wrap; } .topbar .logo { display:flex; font-size:18px; } .topbar .search { order:9; flex-basis:100%; max-width:none; } }
.search { flex:1; max-width:420px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:0 14px; height:40px; }
.search input { border:0; background:none; outline:none; flex:1; min-width:0; }
.search svg { width:16px; height:16px; color:var(--muted); flex:none; }
.wallet { display:flex; align-items:center; gap:6px; height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.wallet .h { color:var(--accent); }
.wallet .f { color:var(--muted); font-weight:500; }
.wallet.pro { border-color:var(--gold); }
.badge-pro { font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--gold); border:1px solid var(--gold); border-radius:5px; padding:0 5px; line-height:17px; }
.pill { font-size:11px; font-weight:700; border-radius:6px; padding:1px 7px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
.pill.gold { background:color-mix(in srgb, var(--gold) 16%, transparent); color:var(--gold); }
.pill.ok { background:color-mix(in srgb, var(--ok) 15%, transparent); color:var(--ok); }

h1.sec, h2.sec { font-family:var(--display); font-weight:700; font-size:19px; margin:30px 0 12px; display:flex; align-items:baseline; gap:10px; text-wrap:balance; flex-wrap:wrap; }
h2.sec small, h1.sec small { font-family:var(--sans); font-size:12.5px; color:var(--muted); font-weight:400; }
.chips { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--muted); }
.chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); font-weight:600; }
.note { color:var(--muted); font-size:12.5px; }
.empty { border:1px dashed var(--line); border-radius:var(--r); padding:22px; color:var(--muted); font-size:13.5px; text-align:center; }
.empty button { margin-top:10px; }

/* ── 버튼 */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 16px; border-radius:11px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; white-space:nowrap; }
.btn:hover { border-color:var(--muted); }
.btn.pri { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.pri:hover { filter:brightness(1.07); }
.btn.gold { background:var(--gold); color:#1d1404; border-color:var(--gold); }
.btn.ghost { background:none; border-color:transparent; color:var(--muted); }
.btn.ghost:hover { color:var(--fg); background:var(--surface2); }
.btn.sm { height:32px; padding:0 11px; font-size:13px; border-radius:9px; }
.btn.block { width:100%; }
.btn.danger { color:var(--err); }
.btn:disabled { opacity:.45; cursor:not-allowed; filter:none; }
.icon-btn { width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; border:0; background:none; color:var(--muted); flex:none; }
.icon-btn:hover { background:var(--surface2); color:var(--fg); }
.icon-btn svg { width:20px; height:20px; }

/* ── 커버 아트 */
.cover { position:relative; overflow:hidden; isolation:isolate; color:#fff; container-type:inline-size;
  background:radial-gradient(110% 70% at 85% 5%, color-mix(in srgb, var(--c3) 55%, transparent), transparent 62%), linear-gradient(165deg, var(--c1) 10%, var(--c2) 120%); }
.cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.cover::before { content:""; position:absolute; inset:0; z-index:1; pointer-events:none; }
.cover::after { content:""; position:absolute; inset:0; z-index:2; background:linear-gradient(to top, rgba(8,6,12,.55), transparent 45%); pointer-events:none; }
.cover .glyph { position:absolute; right:-.08em; bottom:-.2em; font-family:var(--display); font-weight:800; font-size:82cqw; line-height:1; color:color-mix(in srgb, var(--c3) 38%, transparent); z-index:1; user-select:none; }
.cover .vt { position:absolute; left:9%; top:9%; writing-mode:vertical-rl; font-family:var(--display); font-weight:700; font-size:max(11px, 7.2cqw); letter-spacing:.14em; z-index:3; text-shadow:0 1px 8px rgba(0,0,0,.4); max-height:82%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.cover.has-img .glyph, .cover.has-img .vt { display:none; }
.m-rain::before { background:repeating-linear-gradient(103deg, rgba(255,255,255,.13) 0 1px, transparent 1px 11px); -webkit-mask:linear-gradient(to bottom, #000, transparent 85%); mask:linear-gradient(to bottom, #000, transparent 85%); }
.m-city::before { background:repeating-linear-gradient(90deg, transparent 0 7%, rgba(255,226,170,.35) 7% 8%, transparent 8% 11%), linear-gradient(to top, rgba(0,0,0,.5), transparent);
  -webkit-mask:linear-gradient(to top, #000 0 38%, transparent 62%); mask:linear-gradient(to top, #000 0 38%, transparent 62%); }
.m-stars::before { background:
  radial-gradient(1.4px 1.4px at 12% 18%, #fff 50%, transparent), radial-gradient(1px 1px at 31% 42%, #fff 50%, transparent),
  radial-gradient(1.6px 1.6px at 58% 12%, #fff 50%, transparent), radial-gradient(1px 1px at 77% 33%, #fff 50%, transparent),
  radial-gradient(1.2px 1.2px at 88% 9%, #fff 50%, transparent), radial-gradient(1px 1px at 44% 26%, #fff 50%, transparent),
  radial-gradient(1.3px 1.3px at 20% 58%, #fff 50%, transparent), radial-gradient(1px 1px at 66% 52%, #fff 50%, transparent),
  radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.08), transparent); }
.m-glow::before { background:radial-gradient(circle at 28% 72%, color-mix(in srgb, var(--c3) 60%, transparent), transparent 42%), radial-gradient(circle at 28% 72%, rgba(255,255,255,.25), transparent 12%); }
.m-petals::before { background:
  radial-gradient(9px 5px at 18% 22%, color-mix(in srgb, var(--c3) 85%, transparent) 60%, transparent), radial-gradient(7px 4px at 72% 16%, color-mix(in srgb, var(--c3) 75%, transparent) 60%, transparent),
  radial-gradient(8px 5px at 40% 48%, color-mix(in srgb, var(--c3) 70%, transparent) 60%, transparent), radial-gradient(6px 4px at 84% 54%, color-mix(in srgb, var(--c3) 80%, transparent) 60%, transparent),
  radial-gradient(7px 4px at 26% 70%, color-mix(in srgb, var(--c3) 65%, transparent) 60%, transparent); }
.m-ash::before { background:radial-gradient(rgba(255,255,255,.18) 1px, transparent 1.6px) 0 0/14px 14px, linear-gradient(to bottom, rgba(0,0,0,.25), transparent 50%); -webkit-mask:linear-gradient(to bottom, #000, transparent); mask:linear-gradient(to bottom, #000, transparent); }
.m-curtain::before { background:repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 6px, rgba(255,255,255,.06) 6px 9px, transparent 9px 18px), radial-gradient(70% 45% at 50% 0%, color-mix(in srgb, var(--c3) 45%, transparent), transparent);
  -webkit-mask:linear-gradient(to right, #000 0 22%, transparent 34% 66%, #000 78%); mask:linear-gradient(to right, #000 0 22%, transparent 34% 66%, #000 78%); }

/* ── 홈 */
.hero { display:grid; grid-auto-flow:column; grid-auto-columns:min(560px, 86%); gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; scrollbar-width:thin; }
.hero-card { scroll-snap-align:start; border-radius:18px; overflow:hidden; border:0; padding:0; text-align:left; display:grid; grid-template-columns:42% 1fr; background:var(--surface); min-height:230px; box-shadow:0 1px 0 var(--line); }
.hero-card .cover { height:100%; min-height:230px; }
.hero-card .body { padding:18px 18px 16px; display:flex; flex-direction:column; gap:8px; min-width:0; }
.hero-card .k { font-size:11.5px; color:var(--accent); font-weight:600; letter-spacing:.06em; }
.hero-card h3 { margin:0; font-family:var(--display); font-size:22px; line-height:1.25; text-wrap:balance; }
.hero-card p { margin:0; color:var(--muted); font-size:13.5px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.hero-card .who { margin-top:auto; font-size:13px; font-weight:600; }
@media (max-width:520px) { .hero-card { grid-template-columns:1fr; } .hero-card .cover { min-height:170px; } }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:16px 14px; }
.row-scroll { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(160px, 200px); gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; scrollbar-width:thin; }
.row-scroll > * { scroll-snap-align:start; }
.card .cast-n { position:absolute; left:8px; bottom:8px; z-index:3; font-size:11px; font-weight:600; background:rgba(0,0,0,.45); backdrop-filter:blur(6px); padding:2px 8px; border-radius:999px; color:#fff; white-space:nowrap; }
@media (max-width:420px) { .grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px 10px; } }
.card { border:0; padding:0; background:none; text-align:left; display:flex; flex-direction:column; gap:7px; min-width:0; }
.card .cover { aspect-ratio:3/4; border-radius:14px; width:100%; max-width:100%; transition:transform .2s; }
.card:hover .cover { transform:translateY(-3px); }
.card .t { font-weight:700; font-size:14.5px; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card .d { color:var(--muted); font-size:12.5px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.9em; }
.card .meta { display:flex; gap:6px; font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
.cat { position:absolute; top:8px; right:8px; z-index:3; font-size:10.5px; font-weight:600; background:rgba(0,0,0,.42); backdrop-filter:blur(6px); padding:2px 8px; border-radius:999px; color:#fff; }
.cont { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:10px; }
.cont > button { display:flex; gap:12px; align-items:center; text-align:left; padding:10px; border-radius:14px; border:1px solid var(--line); background:var(--surface); min-width:0; }
.cont .cover { width:52px; height:52px; border-radius:12px; flex:none; }
.cont .x { min-width:0; flex:1; }
.cont .x b { display:block; font-size:14px; }
.cont .x span { display:block; color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ── 캐릭터 상세 */
.detail { display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:28px; align-items:start; }
@media (max-width:780px) { .detail { grid-template-columns:1fr; gap:18px; } }
.detail > div > .cover { aspect-ratio:3/4; border-radius:20px; width:100%; max-width:100%; }
@media (max-width:780px) { .detail > div > .cover { aspect-ratio:4/3; } }
.detail h1 { font-family:var(--display); font-size:30px; line-height:1.2; margin:4px 0 6px; text-wrap:balance; }
.detail .lead { font-size:15.5px; margin:0 0 12px; }
.detail .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.detail .tags span { font-size:12.5px; background:var(--surface2); border-radius:7px; padding:2px 9px; color:var(--muted); }
.box { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; }
.box + .box { margin-top:12px; }
.box h3 { margin:0 0 8px; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.04em; }
.box p { margin:0; white-space:pre-wrap; }
.openings { display:grid; gap:8px; }
.opening { display:block; border:1px solid var(--line); border-radius:12px; padding:11px 13px; cursor:pointer; background:var(--bg); }
.opening:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
.opening input { accent-color:var(--accent); margin-right:6px; }
.opening b { font-size:14px; }
.opening span { color:var(--muted); font-size:12.5px; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.cast { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px,1fr)); gap:10px; }
.cast button { border:0; background:none; padding:0; text-align:center; font-size:12.5px; display:grid; gap:5px; min-width:0; }
.cast .portrait { aspect-ratio:1; border-radius:14px; overflow:hidden; }
.cast b { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cta-row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center; }
.cta-row .btn.pri.big { flex:1; min-width:180px; height:48px; font-size:15px; }
.field { display:grid; gap:5px; margin-top:12px; }
.field label, .lbl { font-size:12.5px; color:var(--muted); font-weight:600; }
.field input, .field textarea, .field select, .inp { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); outline:none; }
.field input:focus, .field textarea:focus, .field select:focus, .inp:focus { border-color:var(--accent); }
.field textarea { resize:vertical; min-height:84px; line-height:1.55; }
.field input[type=range] { padding:0; border:0; background:none; accent-color:var(--accent); }
.two { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
@media (max-width:560px) { .two { grid-template-columns:1fr; } }

/* ── 장면 이미지 */
.scene-img { margin:4px 0 8px; max-width:min(380px, 100%); border-radius:16px; overflow:hidden; background:var(--surface2); position:relative; }
.scene-img img { display:block; width:100%; height:auto; max-height:520px; object-fit:cover; cursor:zoom-in; }
.scene-img figcaption { position:absolute; left:10px; bottom:9px; font-size:11.5px; font-weight:600; color:#fff; background:rgba(0,0,0,.45); backdrop-filter:blur(4px); border-radius:999px; padding:2px 10px; }
/* 한 응답에 인물 그림이 여러 장이면 작게, 글 없이 이어진 그림은 나란히 */
.many-img .scene-img { max-width:min(220px, 62%); }
.many-img .scene-img img { max-height:300px; }
.scene-row { display:flex; gap:8px; margin:4px 0 8px; }
.scene-row .scene-img { flex:1 1 0; min-width:0; max-width:200px; margin:0; }
.scene-row .scene-img figcaption { left:6px; bottom:6px; font-size:10.5px; padding:2px 7px; }
.artcard { position:relative; aspect-ratio:4/5; width:100%; overflow:hidden; isolation:isolate; container-type:inline-size; color:#fff;
  background:radial-gradient(80% 60% at 70% 20%, color-mix(in srgb, var(--tint) 55%, transparent), transparent 70%), radial-gradient(60% 50% at 20% 90%, color-mix(in srgb, var(--c3) 40%, transparent), transparent 70%), linear-gradient(160deg, var(--c1), var(--c2)); }
.artcard::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 2px, transparent 2px 10px); z-index:0; }
.artcard .ac-g { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); font-family:var(--display); font-weight:800; font-size:62cqw; line-height:1; color:rgba(255,255,255,.88); text-shadow:0 8px 40px color-mix(in srgb, var(--tint) 70%, transparent); z-index:1; }
.artcard .ac-s { position:absolute; top:12px; left:12px; font-family:var(--display); font-weight:700; font-size:max(13px, 6.5cqw); letter-spacing:.08em; z-index:2; color:color-mix(in srgb, var(--tint) 80%, #fff); }

function curText(m) { return m.role === "ai" ? (m.alts[m.idx] || {}).text || "" : m.text; }
/* 최근 AI 응답 2개의 단락 첫머리(앞 24자): 모델이 같은 시작·묘사를 되풀이하지 않게 rulesPrompt에 보여 줌. 시스템 메시지([…])는 형식이라 뺌 */
function usedOpeners(hist) {
  const out = [];
  for (const m of hist.filter((x) => x.role === "ai" && curText(x)).slice(-2))
    for (const p of curText(m).split(/\n+/)) {
      const t = p.replace(/\[\[img:[^\]]*\]\]/g, "").trim();
      if (t.startsWith("[")) continue;
      const s = t.replace(/^[^:"“*]{1,14}:\s*/, "").replace(/^[*"“\s]+/, "").replace(/[*"”\s]+$/, "").trim();

}
function buildInput(r, uptoIdx, statusBefore, direction) {
  const hist = r.msgs.slice(0, uptoIdx).filter((m) => curText(m));
  const recent = hist.slice(-(r.set.mem * 2 + 1));
  const lore = matchLore(getChar(r.char.id)?.lore || r.char.lore, recent.slice(-3).map((m) => (m.role === "ai" ? curText(m) : m.text) || ""));
  const len = LEN[r.set.len] || LEN.mid;
  const out = [{ role: "user", content: rulesPrompt(r, lore, hist) }];
  out.lore = lore.map((e) => e.keys[0]);
  recent.forEach((m, i) => {
    const last = i === recent.length - 1;
    if (m.role === "ai") { out.push({ role: "assistant", content: curText(m) }); return; }
    let t = m.sys ? "// 직전 장면에서 자연스럽게 이어서 다음 장면을 써라. 유저의 행동은 쓰지 않는다." : m.text;
    // 분량·대화·새 전개 지시는 시스템 프롬프트에도 있지만, 모델이 가장 잘 따르는 마지막 입력 옆에 한 번 더
    if (last) t = `[현재 상태창 — 이번 장면은 여기서 출발한다]\n${JSON.stringify(statusBefore || {})}\n\n[${r.persona.name}의 입력]\n${t}${direction ? "\n\n// 다시 쓰기 지침: " + direction : ""}\n\n[이번 응답] 위 입력을 본문에 다시 옮겨 적지 말고 그 직후의 반응부터 쓴다. 본문 ${len.chars}, 대사 ${len.lines}줄 이상을 주고받고, 직전 응답과 다른 새 전개를 넣는다. 나오는 인물마다 [[img:코드:번호]]를 한 장씩 넣는다${(() => { const h = m.sys ? [] : sitHints(m.text, unfilteredRoute(r)); return h.length ? `(유저 입력에 맞는 번호 후보: ${h.join(", ")})` : ""; })()}.`;
    out.push({ role: "user", content: t });
  });

}

/* ---------------------------------------------------------------- 대화방 저장 */
function roomKey(id) { return "room-" + id; }
function indexRoom(r) {

  const entry = { id: r.id, charId: c.id, name: c.name, title: c.title, glyph: c.glyph, pal: c.pal, motif: c.motif, img: c.img || "", at: r.at,
    last: (lastAi ? curText(lastAi) : "").replace(/\[\[img:[^\]]*\]\]/g, "").replace(/[*"\[\]]/g, "").replace(/\s+/g, " ").trim().slice(0, 70) };
  S.rooms = [entry, ...S.rooms.filter((x) => x.id !== r.id)].sort((a, b) => b.at - a.at);
  KV.set("rooms", S.rooms); renderRailRecent();
}
function saveRoom(r) {
  if (deletedRooms.has(r.id)) return; // 지운 뒤 끝난 응답·요약이 방을 되살리지 않게
  r.at = Date.now();
  if (r.msgs.length > MAX_MSGS_KEEP) r.msgs = r.msgs.slice(-MAX_MSGS_KEEP);
  r.msgs.forEach((m, i) => { delete m.editing; if (m.role === "ai" && i < r.msgs.length - 20 && m.alts.length > 1) { m.alts = [m.alts[m.idx]]; m.idx = 0; } });
  KV.set(roomKey(r.id), r);
  indexRoom(r);
}
const MAX_MSGS_KEEP = 160;
const deletedRooms = new Set();
function migrateRoom(r) {

  if (!r.v2) {
    const old = r.set || {};
    r.set = { model: old.tier === "default" ? "story" : "lite", len: old.len === "long" ? "long" : old.len === "short" ? "short" : "mid", mem: 10, rerollAsk: false };
    r.memHist = []; r.sinceMem = 0; r.turn = r.msgs.filter((m) => m.role === "user").length; r.userNote = ""; r.bookmarks = [];
    r.persona = { memo: "", img: "", ...r.persona }; r.v2 = true;
    if (Array.isArray(r.facts) && r.facts.length && !r.memory) r.memory = "[이전 버전에서 옮긴 기억]\n" + r.facts.map((f) => "- " + f).join("\n");
    delete r.facts; delete r.memCursor;

  if (typeof r.set.allowUnfiltered !== "boolean") r.set.allowUnfiltered = false;
  r.msgs.forEach((m) => delete m.editing);

}
function newRoom(c, openingIdx, persona) {

  if (st[c.gauge] === undefined) st[c.gauge] = 10;
  const r = {
    id: uid("r"), v2: true, char: JSON.parse(JSON.stringify(c)), persona: { id: persona.id, name: persona.name, memo: persona.memo || "", desc: persona.desc || "", img: persona.img || "" },
    opening: op.title, directive: op.directive || "", userNote: "", memory: "", memHist: [], sinceMem: 0, turn: 0, status: st, bookmarks: [],
    set: { model: "lite", len: "mid", mem: 10, rerollAsk: false, allowUnfiltered: false },

    const excerpt = msgs.map((m) => (m.role === "ai" ? speakerName(r) : r.persona.name) + ": " + curText(m).replace(/\[\[img:[^\]]*\]\]/g, "").replace(/\s+/g, " ").slice(0, 900)).join("\n");
    const v = await llm([{ role: "user", content: `롤플레이 「${r.char.title}」의 최근 ${n}턴을 장기기억용으로 요약하라. 유저 캐릭터 이름은 ${r.persona.name}.
요약 지침: ${guide}
JSON {"title":"이 구간의 짧은 제목(15자 이내)","summary":"4~8문장 요약"} 하나로만 답하라.

[직전까지의 기억 끝부분]
${(r.memory || "(없음)").slice(-800)}

[이번 구간 대화]
${excerpt}` }], { tier: "quick", json: true, room: r });
    if (!v || typeof v.summary !== "string") throw 0;
    r.memory = ((r.memory || "").trim() + `\n\n[${from}-${to}턴] ${String(v.title || "").slice(0, 30)}\n${v.summary.trim()}`).trim();
    // 요약하는 동안 진행된 턴은 다음 요약 몫으로 남김(0으로 지우면 그 턴들이 요약에서 빠짐)
    r.sinceMem = Math.max(0, (r.sinceMem || 0) - n);
    if (r.memory.length > cfg.limit) {
      pushHist(r, r.memory, "압축 전 기억");
      flagMemo(true, "기억이 길어져 압축하는 중…");
      const snap = r.memory;
      const c2 = await llm([{ role: "user", content: `다음 장기기억 노트를 ${Math.round(cfg.limit * 0.6)}자 이내로 압축하라. [a-b턴] 구간 표시는 합쳐도 되지만 사건 순서는 유지하고, 관계·약속·비밀·능력·수치·떡밥을 우선 남겨라. JSON {"memory":"..."} 하나로만 답하라.\n\n${r.memory}` }], { tier: "quick", json: true, room: r });
      // 압축하는 사이 기억이 바뀌었으면(직접 고침 등) 덮어쓰지 않고 다음 요약 때 다시 압축
      if (r.memory !== snap) {}
      else if (c2 && typeof c2.memory === "string" && c2.memory.trim()) r.memory = c2.memory.trim().slice(0, cfg.limit);
      else r.memory = r.memory.slice(-cfg.limit);
    }
    saveRoom(r);
    if (manual) toast("장기기억을 업데이트했어요");
  } catch (e) { if (manual) toast("요약하지 못했어요. 잠시 뒤 다시 시도해 주세요."); }
  finally { summarizing = false; flagMemo(false); }
}

function galleryItems(r) {
  const out = [], seen = new Set();
  r.msgs.forEach((m) => imgTags(curText(m)).forEach((t) => { const k = t.code + ":" + t.sit; if (!seen.has(k) && (r.char.cast || []).some((x) => x.code === t.code)) { seen.add(k); out.push({ ...t, id: m.id }); } }));
  return out;
}
function jumpTo(id) { const el = $(`.msg[data-id="${id}"]`); if (!el) return; el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400); }
function exportText(r) {
  const head = `${r.char.title} — ${r.opening || ""}\n${r.persona.name}(으)로 플레이 · ${new Date().toLocaleString("ko-KR")}\n\n`;
  return head + r.msgs.filter((m) => curText(m) && !m.sys).map((m) => `${m.role === "ai" ? speakerName(r) : r.persona.name}: ${curText(m).replace(/\[\[img:([a-z0-9]+):(\d+)\]\]/gi, (_, a, b) => `[이미지: ${(r.char.cast.find((x) => x.code === a.toLowerCase()) || {}).name || a} · ${sitName(+b)}]`)}`).join("\n\n");
}
async function exportRoom(r) {
  const data = exportText(r), filename = `HEARTVERSE_${r.char.title.replace(/[^\w가-힣]+/g, "_")}_${new Date().toISOString().slice(0, 10)}.txt`;
  if (DOWNLOADS) { try { await DOWNLOADS.save({ filename, data }); } catch (e) { if (e?.code !== "cancelled" && e?.code !== "declined") toast("내보내지 못했어요. 대화 복사를 써 주세요."); } return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/plain" })); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  catch { copyText(data, "내보내기가 막혀 있어서 대신 복사했어요"); }
}

      <div class="slot-grid">${slotNums().map((i) => { const ref = validRef(slots[i]) ? slots[i] : null, d = sitDef(i); return `<div class="slot"><div class="pic${bulk && bulk.code === cur && bulk.at === i ? " busy" : ""}">${ref ? IMG.tag(ref) : artHTML(c, cast, i)}</div><span class="lb">${i} ${esc(sitName(i))}${d && d.rating !== "safe" ? " 🔞" : ""}${i === 0 ? " <small>첫 등장</small>" : ""}</span><div class="bs"><button data-up="${i}">${ref ? "바꾸기" : "올리기"}</button><button data-ai="${i}">AI</button>${ref ? `<button data-rm="${i}">삭제</button>` : ""}${d ? `<button data-ed="${i}">고치기</button>` : ""}</div></div>`; }).join("")}</div>
      <input type="file" id="one" accept="image/png,image/jpeg,image/webp" hidden><input type="file" id="many" accept="image/png,image/jpeg,image/webp" multiple hidden>
      <p class="note" style="margin-top:12px">AI 버튼은 설정의 Runware 키로 그려요. 같은 인물로 그리려면 작품의 '이미지 출연진' 외모를 자세히 적어 주세요.</p>`, "wide");
    live = ov; IMG.hydrate(ov);
    $$("[data-cc]", ov).forEach((b) => b.onclick = () => { cur = b.dataset.cc; paint(); });
    let target = 0;
    $$("[data-up]", ov).forEach((b) => b.onclick = () => { target = +b.dataset.up; $("#one", ov).click(); });
    $$("[data-rm]", ov).forEach((b) => b.onclick = () => { const m = store()[cur] || {}; IMG.drop(m[b.dataset.rm]); delete m[b.dataset.rm]; store()[cur] = m; persist(); paint(); });
    $$("[data-ai]", ov).forEach((b) => b.onclick = () => {
      const i = +b.dataset.ai, code = cur;
      genImageSheet({ title: `${cast.name} · ${i} ${sitName(i)}`, parts: savedParts(c, cast, i), save: { c, cast, i }, aspect: "4:5", rating: slotRating(i),
        onUse: async (blob) => { await put(blob, i, code); persist(); if (live?.isConnected) paint(); toast("이미지를 등록했어요"); } });
    });
    $$("[data-ed]", ov).forEach((b) => b.onclick = () => sitEditor(sitDef(+b.dataset.ed), paint));
    const rs = $("#slotRt", ov); if (rs) rs.onchange = () => setSheetRating(c.id, rs.value);
    $("#addSit", ov).onclick = () => sitEditor(null, paint);
    $("#recSit", ov).onclick = () => sitPresetSheet(paint);
    $("#listSit", ov).onclick = () => sitListSheet(paint);
    $("#aiAll", ov).onclick = async () => {
      if (bulk) { bulk.stop = true; return; }
      if (!hasRunwareKey()) { toast(genErr({ code: "no_key" })); return; }
      const code = cur, ca = cast, todo = slotNums().filter((i) => !validRef((imagesOf(c)[code] || {})[i]));
      if (!todo.length) { toast("빈 칸이 없어요"); return; }
      bulk = { code, at: -1, stop: false }; let ok = 0, err = null;
      for (const i of todo) {
        if (bulk.stop) break;
        bulk.at = i; if (live?.isConnected) paint(); toast(`AI로 채우는 중… ${ok + 1}/${todo.length}`);
        try { const rt = imgRating(slotRating(i)); await put(await runwareImage(await partsTags(savedParts(c, ca, i), rt !== "safe"), { aspect: "4:5", rating: rt }), i, code); persist(); ok++; }
        catch (e) { err = e; if (["no_key", "bad_key", "no_funds", "bad_model", "network", "rate_limited", "minor_block"].includes(e?.code)) break; }
      }
      const stopped = bulk.stop; bulk = null; if (live?.isConnected) paint();
      toast(`${ok}장 만들었어요${stopped ? " (멈춤)" : err ? ` · ${genErr(err)}` : ""}`);
    };
    $("#one", ov).onchange = async (e) => { const f = e.target.files[0]; if (!f) return; toast("올리는 중…"); try { await put(f, target); persist(); paint(); toast("이미지를 등록했어요"); } catch { toast("이미지를 읽지 못했어요. PNG·JPG로 다시 올려 주세요."); } };
    $("#bulk", ov).onclick = () => $("#many", ov).click();
    $("#many", ov).onchange = async (e) => {
      const files = [...e.target.files]; let ok = 0, skip = 0; toast(files.length + "장을 올리는 중…");
      for (const f of files) {
        const base = f.name.replace(/\.[^.]+$/, "").toLowerCase(), m = base.match(/(?:^|[_\-\s])([a-z]+\d*)?[_\-\s]?(\d{1,2})$/) || base.match(/^(\d{1,2})$/);
        const sit = m ? +(m[2] ?? m[1]) : NaN;
        if (!slotNums().includes(sit)) { skip++; continue; }
        try { await put(f, sit); ok++; } catch { skip++; }
      }
      persist(); paint(); toast(`${ok}장 등록${skip ? `, ${skip}장은 번호를 알 수 없어 건너뛰었어요` : ""}`);
    };
    $("#prompt", ov).onclick = () => { const nums = slotNums(); copyText(nums.map((i) => `${i} ${sitName(i)}: ${prompt(cast, i)}`).join("\n"), `${nums.length}칸 프롬프트를 복사했어요`); };
  };
  paint();
}

/* ---------------------------------------------------------------- 세계관 일러스트: 대표 일러스트(표지) + 키워드북 항목별 그림.
   내 작품은 작품(img·loreImages)에, 그 밖의 작품은 내 계정(coverpacks·lorepacks)에 저장 */
function loreImg(c, key) { const live = getChar(c.id) || c; return (S.lorepacks[c.id] || {})[key] || (live.loreImages || {})[key] || ""; }
function lorePrompt(c, e) { return ["scenery, wide shot, detailed background, atmospheric lighting, no text", e.text].filter(Boolean).join(", "); }
function pubLore(m) { const out = {}; for (const [k, ref] of Object.entries(m || {}).slice(0, 40)) if (typeof ref === "string" && ref.startsWith("/_blob/") && validRef(ref)) out[String(k).slice(0, 20)] = ref; return out; }
function worldArtHTML(c) {
  const lore = (getChar(c.id) || c).lore || [];
  if (!lore.length) return "";
  return `<div class="wgal">${lore.map((e) => { const ref = loreImg(c, e.keys[0]); return `<figure class="wcard">${ref ? `<button class="wpic" data-wlb="${esc(e.keys[0])}" aria-label="${esc(e.keys[0])} 크게 보기">${IMG.tag(ref)}</button>` : `<div class="wpic ph">${esc(e.keys[0])}</div>`}<figcaption><b>${esc(e.keys[0])}</b><span>${esc(e.text)}</span></figcaption></figure>`; }).join("")}</div>`;
}
function openWorldArt(c) {
  c = normalizeChar(getChar(c.id) || c);
  const mine = S.mine.find((m) => m.id === c.id), lore = c.lore || [];
  const saveMine = () => { KV.set("mine", S.mine); if (mine.publish) publishCommunity(); };
  const getCover = () => mine ? mine.img : S.coverpacks[c.id];
  const setRef = (key, ref) => {
    if (key === "__cover") {
      if (mine) { IMG.drop(mine.img); mine.img = ref; saveMine(); }
      else { IMG.drop(S.coverpacks[c.id]); if (ref) S.coverpacks[c.id] = ref; else delete S.coverpacks[c.id]; KV.set("coverpacks", S.coverpacks); }
    } else {
      const st = mine ? (mine.loreImages = mine.loreImages || {}) : (S.lorepacks[c.id] = S.lorepacks[c.id] || {});
      IMG.drop(st[key]); if (ref) st[key] = ref; else delete st[key];
      if (mine) saveMine(); else KV.set("lorepacks", S.lorepacks);
    }
    if (location.hash.slice(1) === "c-" + c.id) viewDetail(c.id);
  };
  let live = null;
  const paint = () => {
    const cov = getCover() || "";
    const btns = (key, has) => `<div class="bs"><button data-wup="${esc(key)}">${has ? "바꾸기" : "올리기"}</button><button data-wai="${esc(key)}">AI</button>${has ? `<button data-wrm="${esc(key)}">삭제</button>` : ""}</div>`;
    const ov = sheet(`<div class="sheet-head"><h2>세계관 일러스트</h2><button class="icon-btn" data-x aria-label="닫기">${ICON.close}</button></div>
      <p class="sub">대표 일러스트는 표지·카드에, 항목 그림은 작품 소개에 보여요.${mine ? "" : " 그림은 내 계정에만 저장돼요."}</p>
      ${ratingFieldHTML("worldRt", sheetRating("w:" + c.id), "세계관 일러스트 수위 (AI 버튼)")}
      <div class="warts">
        <div class="slot"><div class="pic cover-pic">${cov ? IMG.tag(cov) : `<div class="wpic ph">표지</div>`}</div><span class="lb">대표 일러스트 <small>3:4</small></span>${btns("__cover", !!cov)}</div>
        ${lore.map((e) => { const ref = loreImg(c, e.keys[0]); return `<div class="slot"><div class="pic land">${ref ? IMG.tag(ref) : `<div class="wpic ph">${esc(e.keys[0])}</div>`}</div><span class="lb">${esc(e.keys[0])} <small>16:9</small></span>${btns(e.keys[0], !!ref)}</div>`; }).join("")}
      </div>
      ${lore.length ? "" : `<p class="note" style="margin-top:10px">키워드북이 없는 작품이라 대표 일러스트만 넣을 수 있어요.</p>`}
      <input type="file" id="wfile" accept="image/png,image/jpeg,image/webp" hidden>`, "wide");
    live = ov; IMG.hydrate(ov);
    let target = "";
    $$("[data-wup]", ov).forEach((b) => b.onclick = () => { target = b.dataset.wup; $("#wfile", ov).click(); });
    $$("[data-wrm]", ov).forEach((b) => b.onclick = () => { setRef(b.dataset.wrm, ""); paint(); });
    $("#wfile", ov).onchange = async (e) => { const f = e.target.files[0]; if (!f) return; toast("올리는 중…"); try { setRef(target, await IMG.put(f)); paint(); toast("그림을 넣었어요"); } catch { toast("이미지를 읽지 못했어요. PNG·JPG로 다시 올려 주세요."); } };
    const rs = $("#worldRt", ov); if (rs) rs.onchange = () => setSheetRating("w:" + c.id, rs.value);
    $$("[data-wai]", ov).forEach((b) => b.onclick = () => {
      const key = b.dataset.wai, e = lore.find((x) => x.keys[0] === key), cover = key === "__cover";
      genImageSheet({ title: `${c.title} · ${cover ? "대표 일러스트" : key}`, aspect: cover ? "3:4" : "16:9", prompt: cover ? coverPrompt(c) : lorePrompt(c, e), rating: sheetRating("w:" + c.id),
        onUse: async (blob) => { setRef(key, await IMG.put(blob)); if (live?.isConnected) paint(); toast(cover ? "대표 일러스트를 넣었어요" : "세계관 일러스트를 넣었어요"); } });
    });
  };
  paint();
}

function parseCast(text, name) {
  const out = [], used = new Set();
  String(text).split("\n").map((l) => l.trim()).filter(Boolean).slice(0, 12).forEach((l) => {
    const [code, nm, look] = l.split("|").map((x) => (x || "").trim());
    const cd = (code || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8);
    if (!cd || !nm || used.has(cd)) return; used.add(cd); out.push({ code: cd, name: nm.slice(0, 16), look: (look || "").slice(0, 200) });
  });

}

function cleanChar(c) {

  const s = (x, n) => typeof x === "string" ? x.slice(0, n) : "";
  if (!/^u[a-z0-9]+$/.test(s(c.id, 40)) || !c.name || !Array.isArray(c.openings) || !c.openings.length) return null;
  const fields = Array.isArray(c.fields) ? c.fields.map((f) => s(f, 12)).filter(Boolean).slice(0, 16) : ["호감도"];
  const gauge = s(c.gauge, 12) || fields[0];
  const cast = Array.isArray(c.cast) ? c.cast.slice(0, 12).map((x) => ({ code: s(x?.code, 8).toLowerCase().replace(/[^a-z0-9]/g, ""), name: s(x?.name, 16), look: s(x?.look, 200) })).filter((x) => x.code && x.name) : [];
  const cleanStatus = (st) => Object.fromEntries(Object.entries(st && typeof st === "object" ? st : {}).slice(0, 20)
    .filter(([, v]) => (typeof v === "number" && Number.isFinite(v)) || typeof v === "string").map(([k, v]) => [s(k, 12), typeof v === "string" ? v.slice(0, 200) : v]));
  const out = { id: c.id, name: s(c.name, 16), title: s(c.title, 24), oneLiner: s(c.oneLiner, 70), cat: CATS.includes(c.cat) ? c.cat : "일상",
    tags: Array.isArray(c.tags) ? c.tags.map((t) => s(t, 12)).slice(0, 5) : [], glyph: s(c.glyph, 1), pal: PALETTES[c.pal] ? c.pal : 0, motif: MOTIFS[c.motif] ? c.motif : "glow",
    img: validRef(c.img) && !String(c.img).startsWith("kv:") ? c.img : "", images: pubImages(c.images), loreImages: pubLore(c.loreImages), world_mode: !!c.world_mode,
    desc: s(c.desc, 600), persona: s(c.persona, 3000), world: s(c.world, 2500), speech: s(c.speech, 800), secret: s(c.secret, 200),
    fields: fields.includes(gauge) ? fields : [gauge, ...fields], gauge, cast: cast.length ? cast : [{ code: "c", name: s(c.name, 16), look: "" }],
    lore: Array.isArray(c.lore) ? c.lore.slice(0, 40).map((e) => ({ keys: Array.isArray(e?.keys) ? e.keys.map((k) => s(k, 20)).filter(Boolean).slice(0, 6) : [], text: s(e?.text, 400) })).filter((e) => e.keys.length && e.text) : [], creator: s(c.creator, 20) || "익명 크리에이터",
    openings: c.openings.slice(0, 6).map((o) => ({ title: s(o?.title, 30), text: s(o?.text, 3000), directive: s(o?.directive, 300), status: cleanStatus(o?.status) })).filter((o) => o.text) };

}
/* 미성년 인물 막기: 출연진 외모나 캐릭터 설정 첫머리("이름(17, 여)")에 19세 미만 나이·학생 신분이 있으면 저장·공개하지 않음 */
function minorFlags(c) {
  const out = [], under = (n) => n > 0 && n < 19;

}
/* 글 속 미성년 암시(19세 미만 나이, 학생·아동 낱말, 그런 Danbooru 태그). 성인 경로·Claude 거절 우회·성인 수위 그림을 막는 데 씀 */

    || /\b(?:child|children|kids?|loli|lolita|shota|toddler|underage|teen|teens|teenager|schoolgirl|schoolboy|school uniform|elementary school|middle school|high school|little girl|little boy|young girl|young boy|aged down)\b/i.test(t);
}

function checkout(item, after) {
  const vat = Math.round(item.price / 11);
  const ov = sheet(`<h2>결제하기</h2><p class="sub">${esc(item.name)}${item.id === "plus" ? ` · 하트 ${PLUS_MONTHLY}개 포함` : ""}</p>
    <div class="sumrow"><span>상품 금액</span><span>${won(item.price - vat)}</span></div>
    <div class="sumrow"><span>부가세</span><span>${won(vat)}</span></div>
    <div class="sumrow total"><span>최종 결제 금액</span><span>${won(item.price)}</span></div>
    <div class="payopt" role="radiogroup" aria-label="결제 수단">
      <label><input type="radio" name="pm" checked> 신용·체크카드</label><label><input type="radio" name="pm"> 간편결제</label><label><input type="radio" name="pm"> 휴대폰 결제</label>
    </div>
    <p class="demo-note">데모 결제예요. 결제 정보를 받지 않고, 실제로 청구되지 않아요.</p>
    <div class="cta-row"><span class="spacer"></span><button class="btn ghost" data-x>취소</button><button class="btn pri" id="pay">${won(item.price)} 결제하기</button></div>`);
  $("#pay", ov).onclick = () => {
    const b = $("#pay", ov); b.disabled = true; b.textContent = "결제 승인 중…";
    setTimeout(() => {
      if (item.id === "plus") { const base = isPro() ? S.wallet.pro.until : Date.now(); S.wallet.pro = { until: base + 30 * 86400000 }; S.wallet.hearts += PLUS_MONTHLY; ledger(PLUS_MONTHLY, "PLUS 월간 하트"); }
      else { S.wallet.hearts += item.hearts; ledger(item.hearts, item.name + " 충전"); }
      S.wallet.history.unshift({ at: Date.now(), name: item.name, price: item.price }); S.wallet.history = S.wallet.history.slice(0, 50);
      saveWallet();
      $(".sheet", ov).innerHTML = `<div class="ok-mark">♥</div><h2 style="text-align:center">결제 완료</h2>
        <p class="sub" style="text-align:center">${item.id === "plus" ? `HEARTVERSE+가 시작됐어요. 라이트 무제한, 하트 ${PLUS_MONTHLY}개가 지급됐어요.` : `하트 ${num(item.hearts)}개가 지급됐어요. 지금 ♥ ${num(S.wallet.hearts)}`}</p>
        <button class="btn pri block" id="done">${after ? "대화로 돌아가기" : "확인"}</button>`;
      $("#done", ov).onclick = () => { ov.remove(); if (after) after(); else route(); };
    }, 1000);
  };
}

    const sets = S.settings.styleSets || [];
    box.innerHTML = sets.length ? sets.map((s) => { const on = S.settings.imgStyle === "set:" + s.id; return `<div class="sset ${on ? "on" : ""}">
      <div class="th">${(s.refs || []).filter(validRef).map((r) => `<span>${IMG.tag(r)}</span>`).join("")}</div>
      <b>${esc(s.name)}${on ? ' <span class="pill">사용 중</span>' : ""}</b>
      <p class="note">${esc(s.prompt || "아직 그림체 문구가 없어요. '문구 뽑기'를 눌러 주세요.")}<br>모델: ${esc(imgModelInfo(s.model || IMG_MODELS[0].id).name)}</p>
      <div class="cta-row" style="margin:0"><button class="btn sm ${on ? "" : "pri"}" data-suse="${esc(s.id)}" ${on ? "disabled" : ""}>사용</button><button class="btn sm" data-sgen="${esc(s.id)}">문구 뽑기</button><button class="btn sm ghost" data-sdel="${esc(s.id)}">삭제</button></div></div>`; }).join("") : `<p class="note">아직 세트가 없어요.</p>`;
    IMG.hydrate(box);
    $$("[data-suse]", box).forEach((b) => b.onclick = () => { S.settings.imgStyle = "set:" + b.dataset.suse; saveSettings(); refreshStyle(); toast("이 세트의 그림체로 만들도록 바꿨어요"); });
    $$("[data-sgen]", box).forEach((b) => b.onclick = () => readSets([b.dataset.sgen]));
    $$("[data-sdel]", box).forEach((b) => b.onclick = () => {
      const s = findSet("set:" + b.dataset.sdel); if (!s) return;
      (s.refs || []).forEach((r) => IMG.drop(r)); S.settings.styleSets = S.settings.styleSets.filter((x) => x !== s);
      if (S.settings.imgStyle === "set:" + s.id) S.settings.imgStyle = "novel";
      saveSettings(); refreshStyle(); toast("세트를 지웠어요");
    });
  };
  const readSets = async (ids) => {
    if (!S.settings.apiKey) { const k = $("#key")?.value.trim(); if (k) { S.settings.apiKey = k; saveSettings(); } }
    if (!hasClaudeKey()) { toast("Anthropic API 키를 넣으면 Claude가 세트 그림을 읽어 그림체 태그를 자동으로 써요."); return; }
    let ok = 0, err = null;
    for (const [i, id] of ids.entries()) {
      const s = findSet("set:" + id); if (!s) continue;
      toast(`그림체를 읽는 중… ${i + 1}/${ids.length} · ${s.name}`);
      try { s.prompt = await claudeStyleTags(s.refs || []); ok++; saveSettings(); refreshStyle(); }
      catch (e) { err = e; if (["no_claude", "bad_claude", "network", "rate_limited"].includes(e?.code)) break; }
    }
    toast(err && !ok ? genErr(err) : `세트 ${ok}개의 그림체 문구를 썼어요${err ? " · " + genErr(err) : ""}`);
  };
  $("#ssetAdd").onclick = () => $("#ssetFile").click();
  $("#ssetFile").onchange = async (e) => {
    const picked = [...e.target.files]; e.target.value = "";
    if (!picked.length) return; toast("그림을 읽는 중…");
    let made = [];
    try {
      let files = [];
      for (const f of picked) files.push(...(/\.zip$/i.test(f.name) || /zip/.test(f.type) ? await unzipImages(f) : [f]));
      files = files.filter((f) => /\.(png|jpe?g|webp)$/i.test(f.name) || /^image\//.test(f.type));
      if (!files.length) { toast("그림 파일을 찾지 못했어요. PNG·JPG·WEBP 또는 그 그림이 든 ZIP을 골라 주세요."); return; }
      for (const g of groupStyleFiles(files).slice(0, 12)) {
        const refs = []; for (const f of g.files) refs.push(await IMG.put(f));
        made.push({ id: uid("ss"), name: g.name, refs, prompt: guessStylePrompt(g.name), model: guessStyleModel(g.name) });
      }
      S.settings.styleSets = [...(S.settings.styleSets || []), ...made];
      if (!activeSet()) S.settings.imgStyle = "set:" + made[0].id;
      saveSettings(); refreshStyle();
      toast(`세트 ${made.length}개를 만들었어요 (${made.map((s) => s.name).join(", ")})`);
    } catch (err) { toast(err?.code === "nozip" ? "이 브라우저는 ZIP을 바로 열 수 없어요. 압축을 풀어 그림 파일들을 골라 주세요." : "파일을 읽지 못했어요. PNG·JPG·ZIP인지 확인해 주세요."); return; }
    if (hasClaudeKey() || $("#key")?.value.trim()) await readSets(made.map((s) => s.id));
  };
  paintSets();
  // 채팅 설정: 바꾸는 즉시 저장·반영
  const chatSet = (k, val) => { S.settings[k] = val; saveSettings(); applySettings(); };
  $("#cfs").oninput = (e) => { chatSet("fs", +e.target.value); $("#cfsV").textContent = e.target.value + "px"; };
  $$("[data-set] button", v).forEach((b) => b.onclick = () => {
    const k = b.parentElement.dataset.set; chatSet(k, k === "chatLh" ? +b.dataset.v : b.dataset.v);
    $$("button", b.parentElement).forEach((x) => x.classList.toggle("on", x === b));
  });
  $("#cEnter").onchange = (e) => chatSet("enterSend", e.target.checked);
  $("#cImg").onchange = (e) => chatSet("sceneImg", e.target.checked);
  // 성인 인증을 체크해야 수위 해제 옵션을 고를 수 있음
  const age = $("#ageChk");
  if (age) { const sync = () => ["#unfilterChk", "#fallbackChk"].forEach((s) => $(s).disabled = !age.checked); age.onchange = sync; sync(); }
  const orm = $("#ormodel");
  if (orm) orm.onchange = () => { $("#ormodelBox").hidden = orm.value !== "custom"; if (orm.value === "custom") $("#ormodelTxt").focus(); };
  $("#setSave").onclick = () => {
    S.settings.apiKey = $("#key").value.trim();
    S.settings.runwareKey = $("#rkey").value.trim(); saveStyle();
    if (age) {
      S.settings.isAgeVerified = age.checked; S.settings.contentFilter = !$("#unfilterChk").checked; S.settings.autoFallback = $("#fallbackChk").checked;
      S.settings.openRouterKey = $("#orkey").value.trim();
      S.settings.customUnfilteredModel = orm.value === "custom" ? $("#ormodelTxt").value.trim() : orm.value;
    }
    const warn = cleanKeys();
    saveSettings(); applySettings(); if (S.engine === "none" && S.settings.apiKey) S.engine = "byok"; viewMe();
    toast(warn.length ? "저장했어요. 키를 확인해 주세요: " + warn.join(" · ") : "설정을 저장했어요");
  };
  $("#gtest").onclick = () => {
    S.settings.runwareKey = $("#rkey").value.trim(); saveStyle(); saveSettings();
    genImageSheet({ title: "Runware 연결 테스트", aspect: "1:1", prompt: "1girl, solo, adult, sitting by the window, holding coffee cup, cat, warm afternoon sunlight, cozy room",
      onUse: async () => toast("테스트 이미지는 저장하지 않아요. Runware 연결이 잘 돼요!") });
  };
  $("#reset").onclick = () => confirmSheet("모든 데이터를 지울까요?", "대화방, 만든 캐릭터, 하트, 페르소나, 이미지 연결이 모두 지워져요. 되돌릴 수 없어요.", "전부 삭제", () => {
    S.rooms.forEach((r) => KV.set(roomKey(r.id), undefined));
    ["rooms", "mine", "wallet", "personas", "profile", "imgpacks", "coverpacks", "lorepacks", "tagpacks", "ponytags"].forEach((k) => KV.set(k, undefined));
    IDB.clear(); try { Object.keys(localStorage).filter((k) => /^hv1_img[a-z0-9]{10,30}$/.test(k)).forEach((k) => localStorage.removeItem(k)); } catch {}
    S.mine = []; publishCommunity();
    setTimeout(() => location.reload(), 600);
  });
}
function personaSheet(p, after) {
  let img = p?.img || "";
  const ov = sheet(`<div class="sheet-head"><h2>${p ? "페르소나 수정" : "새 페르소나"}</h2><button class="icon-btn" data-x aria-label="닫기">${ICON.close}</button></div>
    <div class="avatar-pick" style="margin:8px 0 4px"><div id="avBox">${pavHTML({ name: p?.name || "?", img })}</div><div><input type="file" id="av" accept="image/png,image/jpeg,image/webp" hidden><button class="btn sm" id="avBtn">이미지 올리기</button> <button class="btn sm" id="avAi">AI로 만들기</button> <button class="btn sm ghost" id="avDel" ${img ? "" : "hidden"}>빼기</button><p class="note" style="margin:6px 0 0">대화에서 내 말풍선 옆에 보여요.</p></div></div>
    <div class="field"><label for="pn">이름</label><input id="pn" maxlength="20" value="${esc(p?.name || "")}"></div>
    <div class="field"><label for="pm">메모 (목록에 보이는 한 줄, 예: 관능미 · 츤데레)</label><input id="pm" maxlength="30" value="${esc(p?.memo || "")}"></div>
    <div class="field"><label for="pd">상세 정보 (AI가 보고 나를 대해요)</label><textarea id="pd" maxlength="800" style="min-height:130px" placeholder="예: 27세 남자. 긴 장발의 리프컷, 진한 흑발. 나른하고 귀찮은 말투, 맑은 저음.">${esc(p?.desc || "")}</textarea></div>
    <div class="toggle" style="margin-top:12px"><label for="pdef">기본 페르소나로 쓰기</label><input type="checkbox" id="pdef" ${p?.def ? "checked" : ""}></div>
    <div class="cta-row">${p && S.personas.length > 1 ? `<button class="btn danger" id="pdel">삭제</button>` : ""}<span class="spacer"></span><button class="btn ghost" data-x>취소</button><button class="btn pri" id="psave">저장</button></div>`);
  IMG.hydrate(ov);
  $("#avBtn", ov).onclick = () => $("#av", ov).click();
  $("#av", ov).onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { img = await IMG.put(f); $("#avBox", ov).innerHTML = pavHTML({ name: $("#pn", ov).value || "?", img }); IMG.hydrate(ov); $("#avDel", ov).hidden = false; } catch { toast("이미지를 읽지 못했어요."); } };
  $("#avAi", ov).onclick = () => genImageSheet({ title: "AI로 페르소나 이미지 만들기", aspect: "1:1",
    prompt: ["solo, adult, portrait, upper body, looking at viewer", $("#pd", ov).value.trim() || $("#pn", ov).value.trim(), "simple background"].filter(Boolean).join(", "),
    onUse: async (blob) => { img = await IMG.put(blob); $("#avBox", ov).innerHTML = pavHTML({ name: $("#pn", ov).value || "?", img }); IMG.hydrate(ov); $("#avDel", ov).hidden = false; } });
  $("#avDel", ov).onclick = () => { img = ""; $("#avBox", ov).innerHTML = pavHTML({ name: $("#pn", ov).value || "?", img: "" }); $("#avDel", ov).hidden = true; };
  $("#psave", ov).onclick = () => {
    const name = $("#pn", ov).value.trim(); if (!name) { $("#pn", ov).focus(); return; }
    const item = p || { id: uid("p") }; Object.assign(item, { name, memo: $("#pm", ov).value.trim(), desc: $("#pd", ov).value.trim(), img });
    if ($("#pdef", ov).checked) S.personas.forEach((x) => x.def = false);
    item.def = $("#pdef", ov).checked || (!!p && p.def);
    if (!p) S.personas.push(item);
    if (!S.personas.some((x) => x.def)) S.personas[0].def = true;
    KV.set("personas", S.personas);
    if (room && room.persona.id === item.id) { room.persona = { id: item.id, name: item.name, memo: item.memo, desc: item.desc, img: item.img }; saveRoom(room); renderLog(); }
    ov.remove(); after && after();
  };
  const del = $("#pdel", ov); if (del) del.onclick = () => { S.personas = S.personas.filter((x) => x !== p); if (!S.personas.some((x) => x.def)) S.personas[0].def = true; KV.set("personas", S.personas); ov.remove(); after && after(); };
}
/* 키 붙여넣기 실수 잡기: OpenRouter 키 앞의 "sk-or-"가 빠졌으면 붙이고, 형식이 다른 키는 알려 줌 */
function cleanKeys() {
  const s = S.settings, warn = [];
  if (/^v1-[0-9a-f]{64}$/i.test(s.openRouterKey || "")) s.openRouterKey = "sk-or-" + s.openRouterKey;
  if (s.openRouterKey && !/^sk-or-/.test(s.openRouterKey)) warn.push("OpenRouter 키는 sk-or-로 시작해요");
  if (s.apiKey && !/^sk-ant-/.test(s.apiKey)) warn.push("Anthropic 키는 sk-ant-로 시작해요");
  return warn;
}
function saveSettings() { try { localStorage.setItem("hv1_settings", JSON.stringify(S.settings)); } catch {} KV.set("memcfg", S.settings.memCfg); }
/* 채팅 설정을 화면에 반영(테마는 기기 설정을 따름) */
function applySettings() {
  const s = S.settings, root = document.documentElement;
  root.style.setProperty("--chat-fs", s.fs + "px");
  root.style.setProperty("--chat-lh", s.chatLh);
  root.style.setProperty("--narr-font", s.narrFont === "sans" ? "var(--sans)" : "var(--serif)");
  root.classList.toggle("no-scene-img", s.sceneImg === false);
}

/* ---------------------------------------------------------------- 부팅 */
async function loadAll() {
  const [w, p, pr, mine, rooms, packs, mc, cps, lps, tps] = await Promise.all(["wallet", "personas", "profile", "mine", "rooms", "imgpacks", "memcfg", "coverpacks", "lorepacks", "tagpacks"].map((k) => KV.get(k)));
  if (cps && typeof cps === "object") S.coverpacks = cps;
  if (tps && typeof tps === "object") S.tagpacks = tps;
  if (lps && typeof lps === "object") S.lorepacks = lps;
  if (w && typeof w === "object") S.wallet = { ...S.wallet, ...w, history: Array.isArray(w.history) ? w.history : [], ledger: Array.isArray(w.ledger) ? w.ledger : [], ack: w.ack && typeof w.ack === "object" ? w.ack : {} };
  else if (!S.wallet.welcomed) { S.wallet.hearts = WELCOME; S.wallet.welcomed = true; ledger(WELCOME, "첫 방문 보너스"); KV.set("wallet", S.wallet); }
  if (Array.isArray(p) && p.length) S.personas = p.map((x) => ({ memo: "", img: "", ...x }));
  if (pr && typeof pr === "object") S.profile = pr;
  if (Array.isArray(mine)) S.mine = mine.map(normalizeChar);
  if (Array.isArray(rooms)) S.rooms = rooms;
  if (packs && typeof packs === "object") S.imgpacks = packs;
  IMG.migrate().catch(() => {});
  KV.get("ponytags").then((t) => { if (t && typeof t === "object") TAGS = { ...t, ...TAGS }; }).catch(() => {});
  if (mc && typeof mc === "object") S.settings.memCfg = { ...S.settings.memCfg, ...mc };
  refreshFree();
}
async function boot() {
  try { const s = JSON.parse(localStorage.getItem("hv1_settings") || "null"); if (s) S.settings = { ...S.settings, ...s, memCfg: { ...S.settings.memCfg, ...(s.memCfg || {}) }, unfilteredModels: { ...OR_TIER } }; // 등급별 모델은 화면에서 고치지 않으므로 늘 코드의 OR_TIER
    // AI 그림 기본 수위가 전체이용가로 바뀜(2026-11): 예전 전체 기본 수위와 작품별로 골라 둔 수위를 한 번 비움
    if (!S.settings.imgSafeDefault) { delete S.settings.adultImgRating; S.settings.sheetRatings = {}; S.settings.imgSafeDefault = true; saveSettings(); }
    if (typeof S.settings.openRouterKey !== "string") S.settings.openRouterKey = "";
    const orKey = S.settings.openRouterKey; cleanKeys(); if (orKey !== S.settings.openRouterKey) saveSettings();
    // 그림체를 아직 고른 적 없는 이전 설정은 웹소설 표지 세미리얼로 한 번 옮김
    if (s && !s.styleV2 && (!s.imgStyle || s.imgStyle === "none")) S.settings.imgStyle = "novel";
    if (!Array.isArray(S.settings.styleRefs)) S.settings.styleRefs = [];
    if (!Array.isArray(S.settings.styleSets)) S.settings.styleSets = [];
    S.settings.customSits = (Array.isArray(S.settings.customSits) ? S.settings.customSits : [])
      .filter((d) => d && Number.isInteger(d.n) && d.n >= CUSTOM_BASE && d.n < 100 && d.name && d.prompt).map((d) => ({ ...d, rating: RATINGS[d.rating] ? d.rating : "safe" }));
    // Gemini → Runware: 다른 서비스의 키는 옮기지 않고 지우고, Runware 모델(AIR id)이 아니면 Pony로
    let moved = false;
    if ("geminiKey" in S.settings) { delete S.settings.geminiKey; moved = true; }
    if (!/^[a-z][a-z0-9-]*:\d+@\d+$/i.test(String(S.settings.imgModel || "")) || BAD_IMG_MODELS.includes(S.settings.imgModel)) { S.settings.imgModel = IMG_MODELS[0].id; moved = true; }
    // 그림체: 예전 프리셋 이름은 새 이름으로, 세트에는 모델을 붙이고, 예전 기본 문구(인물·구도 태그가 섞인 것)는 새 그림체 문구로
    const st = S.settings.imgStyle;
    if (OLD_STYLES[st]) { S.settings.imgStyle = OLD_STYLES[st]; moved = true; }
    else if (!String(st).startsWith("set:") && !IMG_STYLES[st]) { S.settings.imgStyle = "webtoon"; moved = true; }
    S.settings.styleSets.forEach((x) => {
      if (!x.model || BAD_IMG_MODELS.includes(x.model)) { x.model = guessStyleModel(x.name); moved = true; }
      // 예전 기본 문구(인물·구도 태그가 섞인 것, 인위적인 세미리얼 문구)는 지금 문구로
      if (/^(anime coloring, cel shading, sharp lineart|semi-realistic, 2\.5d, detailed face, porcelain skin|korean, semi-realistic, 2\.5d, detailed face, pale skin)/.test(x.prompt || "")) { x.prompt = guessStylePrompt(x.name); moved = true; }
      // 첫 애니 문구의 colorful(무지개 머리)·vivid colors("VIVID" 글자) → 지금 문구로
      if (/^illustration, beautiful detailed eyes, .*\b(colorful|vivid colors)\b/.test(x.prompt || "")) { x.prompt = guessStylePrompt(x.name); moved = true; }
    });
    if ("theme" in S.settings) { delete S.settings.theme; moved = true; } // 테마 설정은 없앰(기기 설정을 따름)
    S.settings.fs = clamp(+S.settings.fs || 15.5, 13, 21);
    S.settings.chatLh = clamp(+S.settings.chatLh || 1.8, 1.4, 2.4);
    if (typeof S.settings.runwareKey !== "string") S.settings.runwareKey = "";
    // 따로 올렸던 '참고 그림'은 Runware(글로만 그림)에서 쓸 곳이 없어 저장 공간만 차지하므로 한 번 정리(그림체 세트 그림은 유지)
    if (S.settings.styleRefs.length) { S.settings.styleRefs.forEach((r) => IMG.drop(r)); S.settings.styleRefs = []; moved = true; }
    if (moved) saveSettings(); } catch {}
  applySettings();
  await loadAll();
  renderShell(); route();
  window.addEventListener("hashchange", route);
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($(".lightbox")) $(".lightbox").remove(); else if ($(".overlay")) closeOverlays(); else if (gen) stopGen();
  });

  const hasClaude = !!(window.claude && typeof window.claude.use === "function");
  samplePromise = (async () => {
    if (!hasClaude) { S.engine = hasClaudeKey() ? "byok" : "none"; return; }
    try { SAMPLE = await window.claude.use("sample"); } catch { SAMPLE = null; }
    if (SAMPLE) { S.engine = "sample"; try { const l = await SAMPLE.limits(); S.sampleTiers = Array.isArray(l?.modelTiers) ? l.modelTiers : null; } catch {} }
    else S.engine = hasClaudeKey() ? "byok" : "none";
  })().finally(() => { if ((location.hash.slice(1) || "home") === "home") viewHome(); });

  if (hasClaude) {
    window.claude.use("assets").then((a) => { IMG.assets = a || null; }).catch(() => {});
    window.claude.use("downloads").then((d) => { DOWNLOADS = d || null; }).catch(() => {});
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (db && user) {
        const id = await user.id();
        if (id) {
          DB = db; KV.db = db; KV.uid = id; KV.dbOk = true;
          const remoteRooms = await KV.get("rooms");
          if (remoteRooms === undefined || remoteRooms === null) {
            ["wallet", "personas", "profile", "mine", "rooms", "imgpacks", "memcfg", "coverpacks", "lorepacks", "tagpacks"].forEach((k) => { const v = KV.getLocal(k); if (v !== undefined) KV.set(k, v); });
            S.rooms.forEach((r) => { const v = KV.getLocal(roomKey(r.id)); if (v) KV.set(roomKey(r.id), v); });
          } else { await loadAll(); renderRailRecent(); renderWalletChips(); if (!location.hash.startsWith("#r-")) route(); }
          watchCommunity();
        }
      }
    } catch {}
  }
}
boot();
