# 흐름 시험(npm run e2e — Playwright WebKit·Chromium으로 빌드된 index.html·admin.html의 실제 화면 흐름)을 PR마다 돌린다.
# 실패한 시험만 한 번 더 돌리고(헛실패 대비), 그래도 실패하면 스크린샷(tests/.shots)을 올려 둔다.
# 처음 두 주(2026-11-26쯤까지)는 '알림만' — 필수 검사가 아니라서 실패해도 병합을 막지 않고, 병합 담당이 보고 판단한다(docs/TEAM.md 'main 병합').
# 헛실패가 드물다는 것이 확인되면 사용자가 GitHub 설정에서 필수 검사로 지정한다(tests/README.md 'CI').
name: 흐름 시험
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul # 이 PC와 같은 시간대(날짜가 바뀌는 자리의 시험이 흔들리지 않게). 화면의 날짜·숫자는 앱이 늘 ko-KR로 적어 언어 설정과 무관
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 브라우저 두 종(WebKit·Chromium)과 시스템 라이브러리, 한글 글꼴
        run: |
          npx playwright install --with-deps webkit chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 흐름 시험 (npm run e2e — 실패한 시험만 한 번 더)
        run: npm run e2e -- --retry
      - name: 실패한 화면의 스크린샷 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: tests/.shots
          retention-days: 7
          if-no-files-found: ignore
