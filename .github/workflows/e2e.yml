# 흐름 시험(npm run e2e — Playwright WebKit·Chromium으로 빌드된 index.html·admin.html의 실제 화면 흐름)을 PR마다 돌린다.
# admin.html은 커밋하지 않으므로(M6, 2026-11-26) 시험 전에 npm run build로 둘 다 만든다(index.html이 커밋된 것과 같은지는 빌드 확인 build.yml이 봄).
# 실패한 시험만 한 번 더 돌리고(헛실패 대비), 그래도 실패하면 스크린샷(tests/.shots)을 올려 둔다.
# 2026-11-26부터 필수 검사(사용자 결정 — 처음 두 주는 '알림만'이었음). 실패하면 병합하지 않는다(docs/TEAM.md 'main 병합').
# 필수 검사 지정은 사용자가 GitHub 설정에서 한다(tests/README.md 'CI').
name: 흐름 시험
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    # ubuntu-latest가 아니라 24.04로 고정: 지금 쓰는 Playwright(package-lock의 1.56.1)는 ubuntu 26.04에 WebKit과 시스템 라이브러리를 깔지 못함
    # (2026-11-12 첫 실행이 설치 단계에서 실패). Playwright를 올릴 때 그 판이 지원하는 ubuntu로 같이 올림
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul # 이 PC와 같은 시간대(날짜가 바뀌는 자리의 시험이 흔들리지 않게). 화면의 날짜·숫자는 앱이 늘 ko-KR로 적어 언어 설정과 무관
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 빌드 (npm run build — 커밋하지 않는 admin.html을 만듦)
        run: npm run build
      - name: 브라우저 두 종(WebKit·Chromium)과 시스템 라이브러리, 한글 글꼴
        run: |
          npx playwright install --with-deps webkit chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 흐름 시험 (npm run e2e — 실패한 시험만 한 번 더)
        run: npm run e2e -- --retry
      - name: 실패한 화면의 스크린샷 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: tests/.shots
          retention-days: 7
          if-no-files-found: ignore
