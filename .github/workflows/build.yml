# 소스(src/·content/)로 만든 index.html·admin.html이 커밋된 것과 같은지 + 단위 테스트. 다르면 결과 파일을 직접 고쳤거나 빌드를 안 하고 커밋한 것
name: 빌드 확인
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 모듈·작품 검사 + index.html·admin.html이 소스와 같은지 (npm run check)
        run: npm run check
      - name: 단위 테스트 (npm test)
        run: npm test
