# 소스(src/·content/)로 만든 index.html·admin.html이 커밋된 것과 같은지 + 순서 잠금이 최신이고 기준 가지의 잠금과 맞는지 + 단위 테스트. 다르면 결과 파일을 직접 고쳤거나 빌드를 안 하고 커밋한 것
# 흐름 시험은 따로(e2e.yml)
name: 빌드 확인
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 순서 잠금을 기준 가지와 견주려면 가지와 기록이 있어야 함(기본은 커밋 하나만 받아 옴)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 모듈·작품 검사 + index.html·admin.html이 소스와 같은지 (npm run check)
        run: npm run check
        env:
          # 순서 잠금을 견줄 기준 가지 — PR이면 그 PR이 들어갈 가지, main에 밀 때는 main 자신(늘 통과). 이 값을 주면 가지를 못 읽을 때 건너뛰지 않고 실패
          LOCK_BASE: origin/${{ github.base_ref || 'main' }}
      - name: 단위 테스트 (npm test)
        run: npm test
