<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 채운 하트 + 안쪽 파동, 더 화려하게: 뒤 빛 무리·빛 망울·반짝이·하트 가장자리 빛·광택 -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0" stop-color="#6a1c86"/>
      <stop offset="0.5" stop-color="#34104c"/>
      <stop offset="1" stop-color="#17061f"/>
    </radialGradient>
    <linearGradient id="hg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ff8cc0"/>
      <stop offset="0.45" stop-color="#ff3d86"/>
      <stop offset="1" stop-color="#d8135a"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimg" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#ffc2dc" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffc2dc" stop-opacity=".35"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="bokeh" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="lineglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComponentTransfer in="b" result="bs"><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="spark" d="M0 -12 C1 -3 3 -1 12 0 C3 1 1 3 0 12 C-1 3 -3 1 -12 0 C-3 -1 -1 -3 0 -12 Z"/>
    <path id="heart" d="M256 424 C164 368 84 306 84 210 C84 146 132 100 192 100 C222 100 244 116 256 140 C268 116 290 100 320 100 C380 100 428 146 428 210 C428 306 348 368 256 424 Z"/>
    <clipPath id="hc"><use href="#heart"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 빛 망울 -->
  <g filter="url(#bokeh)" fill="#ff6fb4">
    <circle cx="70" cy="96" r="11" opacity=".28"/>
    <circle cx="448" cy="84" r="8" opacity=".3"/>
    <circle cx="462" cy="300" r="12" opacity=".22"/>
    <circle cx="54" cy="318" r="9" opacity=".26"/>
    <circle cx="112" cy="456" r="12" opacity=".2"/>
    <circle cx="410" cy="452" r="10" opacity=".24"/>
    <circle cx="300" cy="62" r="6" opacity=".3"/>
    <circle cx="188" cy="470" r="6" opacity=".26"/>
  </g>

  <!-- 하트 뒤 빛 무리 -->
  <use href="#heart" fill="#ff2f7d" opacity=".75" filter="url(#halo)"/>

  <!-- 하트 + 가장자리 밝은 빛 + 광택 -->
  <use href="#heart" fill="url(#hg)"/>
  <g clip-path="url(#hc)">
    <ellipse cx="200" cy="170" rx="150" ry="110" fill="url(#gloss)"/>
  </g>
  <use href="#heart" fill="none" stroke="url(#rimg)" stroke-width="4.5" filter="url(#rim)"/>
  <path d="M128 196 C128 156 158 130 194 130" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="12" stroke-linecap="round"/>

  <!-- 파동(하트 안쪽) -->
  <path filter="url(#lineglow)" d="M124 262 H170 L188 244 L204 262 H216 L238 160 L262 356 L286 206 L304 262 H318 L334 246 L350 262 H388" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 반짝이 -->
  <g fill="#fff">
    <use href="#spark" transform="translate(420 132) scale(1.5)"/>
    <use href="#spark" transform="translate(94 380) scale(1.1)" opacity=".9"/>
    <use href="#spark" transform="translate(452 214) scale(.7)" opacity=".85"/>
    <use href="#spark" transform="translate(70 170) scale(.6)" opacity=".8"/>
    <circle cx="384" cy="408" r="3" opacity=".8"/>
    <circle cx="140" cy="70" r="2.5" opacity=".8"/>
  </g>
</svg>
