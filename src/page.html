<!-- 휴대폰(오래된 브라우저·인앱 브라우저)에서 앱 스크립트가 멈추면 빈 화면 대신 이유를 보여 줌. 첫 화면이 그려지면 bootMsg가 사라져 아무 일도 안 함 -->
<script>
window.addEventListener("error", function (e) {
  var m = document.getElementById("bootMsg");
  if (m) m.textContent = "화면을 불러오지 못했어요. 브라우저를 최신으로 업데이트하거나 Chrome·Safari 앱에서 열어 주세요. (" + (e.message || "알 수 없는 오류") + ")";
});
</script>
