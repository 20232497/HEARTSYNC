<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- admin.html은 관리자 도구 빌드 결과물(npm run build)이에요 — git에 넣지 않고 로컬에서 열어요. 고칠 땐 src/·content/를 고치세요 (docs/ARCHITECTURE.md) -->
<!-- 사용자 사이트(index.html)와 같은 소스에서 관리자 모듈(src/js/admin/)을 더해 만들어요. 주석은 모두 남기고 모듈마다 설명 머리를 붙여요 -->
<title>HEART SYNC 관리자</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="HEART SYNC 관리자">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
<!-- @include css/*.css -->
<!-- @include css/admin/*.css -->
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="메인 메뉴"></nav>
  <main id="view"><p class="boot-msg" id="bootMsg">불러오는 중…</p></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>

<!-- 앱 스크립트가 멈추면 빈 화면 대신 이유를 보여 줌(ES5 — 오래된 브라우저에서도 돌게). 첫 화면이 그려지면 bootMsg가 사라져 아무 일도 안 함 -->
<script>
window.addEventListener("error", function (e) {
  var m = document.getElementById("bootMsg");
  if (m) m.textContent = "화면을 불러오지 못했어요. 브라우저를 최신으로 업데이트하거나 Chrome·Safari 앱에서 열어 주세요. (" + (e.message || "알 수 없는 오류") + ")";
});
</script>
<script>
"use strict";
/* ================================================================
   HEART SYNC 관리자 도구 — 작품·이미지·그림체·코드 표를 만들고 content/ 폴더로 내보내는 빌드(admin.html)
   - 사용자 사이트(index.html)의 모든 기능 + src/js/admin/ 모듈. 같은 설정·저장소(이 브라우저·계정)를 씀
   - 그림·코드는 '작품 폴더에 저장'으로 content/<f|m|all>/…/images/ 와 content/codes.json 에 쓰고, npm run build로 사용자 사이트에 실림
   - 주석을 모두 남기고 모듈마다 책임·가져옴·내보냄을 적은 머리를 붙임 (사용자 빌드는 주석을 뺌)
   ================================================================ */
<!-- @script js/admin.js -->
</script>
</html>
